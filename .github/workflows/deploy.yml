name: Build and deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'article-ideas.md'
      - 'context/**'
      - 'ralph-project/**'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/bernatsampera/samperalabs:latest
            ghcr.io/bernatsampera/samperalabs:${{ github.sha }}
          build-args: |
            BLOG_API_KEY=${{ secrets.BLOG_API_KEY }}
            MINIO_ENDPOINT=${{ secrets.MINIO_ENDPOINT }}
            MINIO_ACCESS_KEY=${{ secrets.MINIO_ACCESS_KEY }}
            MINIO_SECRET_KEY=${{ secrets.MINIO_SECRET_KEY }}
            MINIO_BUCKET=${{ secrets.MINIO_BUCKET }}
            NODE_ENV=${{ secrets.NODE_ENV }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify deploy
        if: ${{ success() }}
        run: >-
          curl -fsS
          -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
          "https://coolify.samperalabs.com/api/v1/deploy?uuid=g08c40g44o88s8wwc488w0k8&force=false"
