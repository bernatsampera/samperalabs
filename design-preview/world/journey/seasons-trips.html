<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAAT | Every season is a trip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito+Sans:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root { --paper:#FBF4E6; --card:#FFFDF7; --sand:#F3E3C3; --ink:#233140; --muted:#4E5B68; --deep:#1F5F73; --mint:#CDEFE9; --sun-text:#F9D36A; --coral:#F0745A; --sea:#2B8C96; --line:rgba(35,49,64,.12); --gutter:clamp(20px,4vw,56px); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.5 'Nunito Sans', system-ui, sans-serif; }
  h1, h2, h3 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; margin: 0; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; border-radius: 6px; }
  .label { font: 800 12px 'Nunito Sans'; letter-spacing: .1em; text-transform: uppercase; }

  .bar { position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; padding: 16px var(--gutter); background: rgba(251,244,230,.95); border-bottom: 1px solid var(--line); backdrop-filter: blur(8px); }
  .bar a { font-weight: 800; text-decoration: none; }

  /* Journey header with the time strip */
  .hero { padding: 64px var(--gutter) 56px; background: var(--deep); color: #fff; }
  .hero-inner { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 48px; align-items: end; }
  .hero .label { color: var(--sun-text); }
  .hero h1 { margin: 12px 0 14px; font-size: clamp(38px, 4.6vw, 62px); line-height: 1.05; }
  .hero p { margin: 0; color: var(--mint); max-width: 34em; }
  .strip { display: grid; grid-template-columns: 82px repeat(6, 1fr); row-gap: 8px; font-size: 13px; }
  .strip .month { color: var(--mint); font-weight: 700; padding-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,.2); }
  .strip .name { grid-column: 1; font-weight: 800; align-self: center; }
  .strip a { position: relative; height: 28px; border-radius: 999px; display: flex; align-items: center; padding: 0 12px; font-weight: 800; font-size: 12px; color: var(--ink); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip a.ongoing { padding-right: 26px; border-radius: 999px 4px 4px 999px; }
  .strip a.ongoing::after { content: '→'; position: absolute; right: 9px; }
  .strip a:hover { box-shadow: 0 0 0 2px #fff; }

  /* One trip per season */
  .trips { --side: max(var(--gutter), calc((100vw - 1200px) / 2 + var(--gutter))); padding: 80px 0 120px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 96px; }
  .trip-head { max-width: 1200px; margin: 0 auto; padding: 0 var(--gutter); display: flex; align-items: end; justify-content: space-between; gap: 24px; }
  .season-tag { display: inline-flex; gap: 10px; padding: 4px 12px; border-radius: 999px; background: var(--c); }
  .trip-head h2 { margin: 10px 0 6px; font-size: clamp(30px, 3.2vw, 44px); line-height: 1.08; color: var(--deep); }
  .trip-mission { margin: 0; font: 600 clamp(19px, 1.7vw, 22px)/1.35 'Fraunces', serif; }
  .trip-mission span { font: 800 12px 'Nunito Sans'; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-right: 8px; }
  .controls { display: flex; align-items: center; gap: 10px; flex: none; }
  .controls button { width: 48px; height: 48px; border: 0; border-radius: 50%; background: var(--ink); color: #fff; font: 800 20px 'Nunito Sans'; cursor: pointer; }
  .controls button:disabled { background: #E3D9C6; color: #8A8F96; cursor: default; }

  .track { overflow-x: auto; scroll-behavior: smooth; padding-top: 12px !important; scrollbar-width: none; padding: 0 var(--side); scroll-padding: 0 var(--side);
    --fade: linear-gradient(90deg, rgba(0,0,0,.25) 0, rgba(0,0,0,.4) calc(var(--side) - 24px), #000 var(--side), #000 calc(100% - 96px), rgba(0,0,0,.2) 100%);
    -webkit-mask-image: var(--fade); mask-image: var(--fade); }
  .track::-webkit-scrollbar { display: none; }
  .lane { position: relative; width: max-content; }
  .stops { position: relative; z-index: 1; display: flex; gap: 36px; margin: 0; padding: 0; list-style: none; }
  .lane svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .lane path { fill: none; stroke-linecap: round; }
  .band { stroke: var(--sand); stroke-width: 40; opacity: .75; }
  .dots { stroke: var(--sea); stroke-width: 5; stroke-dasharray: 1 14; }
  .future { stroke: var(--sea); stroke-width: 3; stroke-dasharray: 8 10; opacity: .6; }
  .reveal { stroke: #fff; stroke-width: 14; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 1.8s ease; }
  .trip.seen .reveal { stroke-dashoffset: 0; }

  /* Each stop: top zone, the trail, bottom zone. Cards alternate above and below. */
  .stop { position: relative; z-index: 1; display: grid; grid-template-rows: 350px 96px 350px; width: min(340px, 80vw); }
  .stop.small { width: 150px; }
  .zone { display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 18px; }
  .zone.low { justify-content: flex-start; padding: 18px 0 0; }
  .node { grid-row: 2; align-self: center; justify-self: start; display: grid; place-items: center; width: 76px; height: 76px; border: 2.5px solid var(--ink); border-radius: 50%; background: #F6C445; position: relative; z-index: 2; }
  .node svg { position: static; width: 44px; height: 44px; }
  .node svg * { fill: none; stroke: var(--ink); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .stop.now .node { box-shadow: 0 0 0 6px var(--paper), 0 0 0 9px var(--coral); }
  .node.flag { width: 64px; height: 64px; background: var(--paper); font: 800 13px 'Nunito Sans'; letter-spacing: .06em; text-transform: uppercase; }
  .node.goal { width: 84px; height: 84px; background: var(--deep); color: #fff; border-color: var(--deep); font: 600 34px 'Fraunces', serif; }
  .node.goal.done { background: var(--sea); border-color: var(--sea); }
  .big-date { margin: 0; font: 600 46px/1 'Fraunces', serif; color: #E2D2B0; letter-spacing: -.02em; }
  .card { padding: 22px 24px; background: var(--card); border-radius: 14px; box-shadow: 0 1px 2px rgba(35,49,64,.06), 0 12px 30px rgba(35,49,64,.08); }
  .meta { display: flex; gap: 10px; align-items: center; color: var(--muted); margin: 0; }
  .card { position: relative; }
  .here { position: absolute; top: -13px; right: 18px; padding: 3px 12px; border-radius: 999px; background: var(--coral); color: var(--ink); font: 800 11px "Nunito Sans"; letter-spacing: .1em; text-transform: uppercase; }
  .card h3 { margin: 8px 0 10px; font-size: 23px; line-height: 1.15; }
  .card p { margin: 0; }
  .learned { margin-top: 14px !important; padding: 10px 0 0 12px; border-top: 1px dashed rgba(35,49,64,.3); border-left: 4px solid #7FD1C7; font-size: 15px; }
  .learned strong { display: block; color: var(--deep); font-size: 13px; }
  .more { display: inline-block; margin-top: 14px; font-weight: 800; color: var(--deep); text-decoration: none; border-bottom: 2px solid #7FD1C7; }
  .start-text { margin: 0; color: var(--muted); font-weight: 700; }
  .start-text strong { display: block; color: var(--ink); font: 600 22px 'Fraunces', serif; }
  .goal-card { width: min(320px, 78vw); padding: 22px 24px; border-radius: 14px; background: var(--deep); color: #fff; }
  .goal-card.done { background: var(--sea); }
  .goal-card .label { color: var(--sun-text); }
  .goal-card.done .label { color: #fff; }
  .goal-card h3 { margin: 8px 0 8px; font-size: 22px; line-height: 1.2; }
  .goal-card p { margin: 0; color: var(--mint); }
  .goal-card.done p { color: #fff; }

  @media (max-width: 860px) {
    .hero-inner { grid-template-columns: 1fr; }
    .trip-head { flex-direction: column; align-items: start; }
  }
  @media (prefers-reduced-motion: reduce) {
    .reveal { transition: none; stroke-dashoffset: 0; }
    .track { scroll-behavior: auto; }
  }
</style>
</head>
<body>
<header class="bar"><a href="home.html">← Home</a><a href="story.html?w=knowledge">AI has no memory →</a></header>
<main>
  <section class="hero">
    <div class="hero-inner">
      <div>
        <p class="label">MAAT</p>
        <h1>How does a company become AI native?</h1>
        <p>MAAT makes software for combat sports gyms. I help the team, and the gym owners, work with AI. The journey has three seasons. Each season is a trip with its own mission.</p>
      </div>
      <div class="strip" id="strip" aria-label="When each season ran"></div>
    </div>
  </section>
  <div class="trips" id="trips"></div>
</main>
<script>
const ICONS = {
  heads: '<circle cx="20" cy="24" r="8"/><circle cx="44" cy="24" r="8"/><path d="M7 49c2-10 8-15 15-15s13 5 15 15M31 49c2-10 8-15 15-15 6 0 11 4 13 12"/>',
  brain: '<path d="M20 49c-8 0-11-8-7-13-7-6-2-16 6-15 0-8 11-11 15-4 5-6 16-2 14 6 8 1 11 11 5 16 4 7-3 15-11 13H20Z"/><path d="M32 17v31M20 22c8 0 7 8 12 8M44 25c-7 0-6 7-12 7M20 39c5-1 7 3 7 8M45 39c-5-1-7 3-7 8"/>',
  tree: '<circle cx="32" cy="13" r="5"/><circle cx="17" cy="31" r="5"/><circle cx="47" cy="31" r="5"/><circle cx="10" cy="50" r="5"/><circle cx="26" cy="50" r="5"/><circle cx="40" cy="50" r="5"/><circle cx="55" cy="50" r="5"/><path d="M32 18v6M17 26v-4h30v4M17 36v7M47 36v7M10 43h16M40 43h15"/>',
  photo: '<rect x="9" y="14" width="46" height="37" rx="4"/><circle cx="22" cy="26" r="5"/><path d="m13 46 12-12 8 8 7-7 11 11M22 9h20"/>',
  chat: '<path d="M9 14h46v31H31l-12 9v-9H9Z"/><path d="M19 26h26M19 34h18"/>',
  files: '<path d="M12 18h17l5 6h19v31H12Z"/><path d="M17 10h17l5 6h14v8M20 35h24M20 44h18"/>',
};
const icon = n => `<svg viewBox="0 0 64 64" aria-hidden="true">${ICONS[n]}</svg>`;
const months = ['2026-05', '2026-06', '2026-07', '2026-08', '2026-09', '2026-10'];
const mon = (m, y = true) => new Intl.DateTimeFormat('en', {month: 'short', year: y ? 'numeric' : undefined, timeZone: 'UTC'}).format(new Date(m + '-01T00:00:00Z'));
const seasons = [
  {id: 1, name: 'Internal AI tools', mission: 'How can AI take slow, manual work off the team?', from: '2026-05', to: '2026-09', c: '#7FD1C7'},
  {id: 2, name: 'The company brain', mission: 'Can one place answer any question about MAAT?', from: '2026-05', to: null, c: '#F6B49F'},
  {id: 3, name: 'AI for our customers', mission: 'How can gym owners use AI every day?', from: '2026-09', to: null, c: '#F6C445'},
];
const chapters = [
  {s: 1, icon: 'files', date: '2026-05', title: 'AI migrations to MAAT', simple: 'Moving a gym\'s data into MAAT with AI.', learned: 'Check the AI output before it reaches a customer.'},
  {s: 2, icon: 'heads', date: '2026-05', title: 'The knowledge lived in people\'s heads', simple: 'To do one task, you had to ask three people.', learned: 'Access to data is not knowing how the work is done.'},
  {s: 2, icon: 'brain', date: '2026-06', title: 'We drew a map of what we know', simple: 'One shared place for our knowledge: the MAAT Brain.', learned: 'The shape of knowledge matters.'},
  {s: 2, icon: 'tree', date: '2026-07', title: 'The agent learned to do support tasks', simple: 'The AI reads the map and does real support work.', learned: 'A tree of context lets an agent find its way.'},
  {s: 1, icon: 'photo', date: '2026-09', title: 'From a photo of a schedule to real classes', simple: 'A picture of a schedule becomes real classes.', learned: 'Put a person where the AI is unsure.'},
  {s: 3, icon: 'chat', date: '2026-10', title: 'Gym owners can ask in plain words', simple: 'An owner asks a question. The Admin Agent answers with a table or a chart.', learned: 'Decide what to do before the AI writes.', now: true},
];

const col = m => months.indexOf(m) + 2;
document.getElementById('strip').innerHTML = `<span></span>${months.map(m => `<span class="month">${mon(m, false)}</span>`).join('')}` +
  seasons.map((s, i) => `<span class="name" style="grid-row:${i + 2}">Season ${s.id}</span>
    <a href="#season-${s.id}" class="${s.to ? '' : 'ongoing'}" title="${s.name}" style="grid-row:${i + 2};grid-column:${col(s.from)} / ${s.to ? col(s.to) + 1 : months.length + 2};background:${s.c}">${s.name}</a>`).join('');

document.getElementById('trips').innerHTML = seasons.map(s => {
  const own = chapters.filter(c => c.s === s.id);
  const start = `
    <li class="stop small">
      <div class="zone"><p class="start-text">The trip starts<strong>${mon(s.from)}</strong></p></div>
      <span class="node flag">Start</span>
      <div class="zone low"></div>
    </li>`;
  const steps = own.map((c, i) => {
    const card = `
      <article class="card">
        <p class="meta label">Chapter ${i + 1} &nbsp; ${mon(c.date)}</p>${c.now ? '<span class="here">You are here</span>' : ''}
        <h3>${c.title}</h3><p>${c.simple}</p>
        <p class="learned"><strong>What I learned</strong>${c.learned}</p>
        <a class="more" href="#">Read the full chapter →</a>
      </article>`;
    const date = `<p class="big-date" aria-hidden="true">${mon(c.date)}</p>`;
    return `
      <li class="stop ${c.now ? 'now' : ''}" data-chapter>
        <div class="zone">${i % 2 ? date : card}</div>
        <span class="node">${icon(c.icon)}</span>
        <div class="zone low">${i % 2 ? card : date}</div>
      </li>`;
  }).join('');
  const goalCard = s.to
    ? `<div class="goal-card done"><p class="label">Mission complete, ${mon(s.to)}</p><h3>${s.mission}</h3><p>This trip is over. The next season builds on it.</p></div>`
    : `<div class="goal-card"><p class="label">The mission, still open</p><h3>${s.mission}</h3><p>The next chapter is on its way.</p></div>`;
  const goalUp = own.length % 2 === 0;
  const goal = `
    <li class="stop" data-goal>
      <div class="zone">${goalUp ? goalCard : ''}</div>
      <span class="node goal ${s.to ? 'done' : ''}">${s.to ? '✓' : '?'}</span>
      <div class="zone low">${goalUp ? '' : goalCard}</div>
    </li>`;
  return `
    <section class="trip" id="season-${s.id}" data-done="${s.to ? 'yes' : 'no'}" aria-labelledby="trip-title-${s.id}">
      <div class="trip-head">
        <div>
          <span class="season-tag label" style="--c:${s.c}">Season ${s.id} <span>${mon(s.from, false)} to ${s.to ? mon(s.to, false) : 'now'}</span> <span>${s.to ? 'Done' : 'Ongoing'}</span></span>
          <h2 id="trip-title-${s.id}">${s.name}</h2>
          <p class="trip-mission"><span>Mission</span>${s.mission}</p>
        </div>
        <div class="controls">
          <button type="button" data-dir="-1" aria-label="Earlier in ${s.name}">←</button>
          <button type="button" data-dir="1" aria-label="Later in ${s.name}">→</button>
        </div>
      </div>
      <div class="track" tabindex="0" aria-label="${s.name}, a trip in ${own.length} chapters">
        <div class="lane">
          <svg aria-hidden="true"><defs><mask id="reveal-${s.id}" maskUnits="userSpaceOnUse"><path class="reveal" pathLength="1"/></mask></defs>
            <path class="band"/><path class="dots" mask="url(#reveal-${s.id})"/><path class="future"/></svg>
          <ol class="stops">
          ${start}${steps}${goal}</ol>
        </div>
      </div>
    </section>`;
}).join('');

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
document.querySelectorAll('.trip').forEach(trip => {
  const track = trip.querySelector('.track');
  const lane = trip.querySelector('.lane');
  const svg = lane.querySelector('svg');
  const stops = [...lane.querySelectorAll('.stop')];
  const done = trip.dataset.done === 'yes';

  // A wavy trail through every node: start, chapters, mission.
  const draw = () => {
    const box = lane.getBoundingClientRect();
    svg.setAttribute('viewBox', `0 0 ${box.width} ${box.height}`);
    const pts = stops.map(st => { const r = st.querySelector('.node').getBoundingClientRect(); return [r.left - box.left + r.width / 2, r.top - box.top + r.height / 2]; });
    const seg = (a, b, k) => { const dx = b[0] - a[0], w = (k % 2 ? -1 : 1) * 70; return ` C${a[0] + dx * .4} ${a[1] + w} ${b[0] - dx * .4} ${b[1] + w} ${b[0]} ${b[1]}`; };
    const nowIndex = done ? pts.length - 1 : stops.length - 2;
    let past = `M${pts[0].join(' ')}`, future = '';
    for (let k = 1; k < pts.length; k++) {
      if (k <= nowIndex) past += seg(pts[k - 1], pts[k], k);
      else future += `M${pts[k - 1].join(' ')}` + seg(pts[k - 1], pts[k], k);
    }
    svg.querySelector('.band').setAttribute('d', past + future);
    svg.querySelector('.dots').setAttribute('d', past);
    svg.querySelector('.reveal').setAttribute('d', past);
    svg.querySelector('.future').setAttribute('d', future);
  };
  draw();
  document.fonts.ready.then(draw);
  new ResizeObserver(draw).observe(lane);

  // The trail draws itself the first time the trip comes into view.
  new IntersectionObserver((entries, obs) => { if (entries[0].isIntersecting) { trip.classList.add('seen'); obs.disconnect(); } }, {threshold: .25}).observe(trip);
  if (reduced) trip.classList.add('seen');

  const [prev, next] = trip.querySelectorAll('.controls button');
  const at = () => stops.reduce((best, el, i) => Math.abs(el.offsetLeft - track.scrollLeft) < Math.abs(stops[best].offsetLeft - track.scrollLeft) ? i : best, 0);
  const go = i => track.scrollTo({left: stops[Math.max(0, Math.min(stops.length - 1, i))].offsetLeft});
  const update = () => { prev.disabled = track.scrollLeft <= 2; next.disabled = track.scrollLeft >= track.scrollWidth - track.clientWidth - 2; };
  prev.addEventListener('click', () => go(at() - 1));
  next.addEventListener('click', () => go(at() + 1));
  track.addEventListener('scroll', update, {passive: true});
  track.addEventListener('keydown', e => { if (e.key === 'ArrowRight') { e.preventDefault(); go(at() + 1); } if (e.key === 'ArrowLeft') { e.preventDefault(); go(at() - 1); } });

  // Open each trip on its newest chapter, with the mission ahead of it.
  const newest = [...lane.querySelectorAll('[data-chapter]')].at(-1);
  track.style.scrollBehavior = 'auto';
  track.scrollLeft = Math.min(track.scrollWidth - track.clientWidth, stops[stops.indexOf(newest) - 1].offsetLeft);
  track.style.scrollBehavior = '';
  update();
});
</script>
</body>
</html>
