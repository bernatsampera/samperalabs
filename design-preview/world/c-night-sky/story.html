<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A story about knowledge, told one star at a time.">
  <title>Story | The Night Sky</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="night-sky.css">
</head>
<body class="story-page">
  <a class="skip-link" href="#chapters">Skip to the story</a>
  <header class="story-nav">
    <a href="home.html" class="back-link" aria-label="Return to the night sky"><span aria-hidden="true">←</span> Night sky</a>
    <a id="other-workspace" class="other-link" href="#"></a>
  </header>
  <div class="story-controls" aria-label="Story navigation">
    <a id="bar-name" href="#story-title"></a>
    <nav id="bar-index" aria-label="Chapter stars"></nav>
    <button id="start-first" class="primary-button" type="button">Start from the first star</button>
  </div>
  <main>
    <section class="story-heading" aria-labelledby="story-title">
      <p id="story-kind" class="eyebrow"></p>
      <h1 id="story-title"></h1>
      <p id="story-one-liner" class="story-one-liner"></p>
      <nav id="chapter-index" class="chapter-index" aria-label="Star chart"></nav>
    </section>

    <div class="story-layout">
      <aside class="constellation-panel" aria-label="Workspace constellation">
        <div class="panel-label"><span>Star chart</span><strong id="panel-name"></strong></div>
        <svg id="story-constellation" viewBox="0 0 620 680" role="img"></svg>
        <p id="star-title" class="star-title" aria-live="polite"></p>
      </aside>
      <section id="chapters" class="chapters" aria-label="Chapters"></section>
    </div>
  </main>

  <dialog id="telescope" class="telescope">
    <div class="dialog-inner">
      <button id="close-telescope" class="dialog-close" type="button" aria-label="Close telescope detail">Close</button>
      <p class="eyebrow">Through the telescope</p>
      <h2 id="dialog-title"></h2>
      <p id="dialog-deep"></p>
      <div id="dialog-link"></div>
    </div>
  </dialog>
  <script src="../shared/data.js"></script>
  <script src="story.js"></script>
</body>
</html>
