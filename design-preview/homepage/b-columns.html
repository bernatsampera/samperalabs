<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bernat Sampera, AI engineer focused on context</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800;6..12,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="base.css">
<style>
  /* Option B: two columns. Me on the left (sticky), my work on the right (scrolls). */
  html { scroll-padding-top: var(--space-7); }

  .layout { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); }

  /* Left column: who I am. The sun block runs the full page height; its content stays on screen.
     The top and bottom text lines align with the text inside the MAAT panel. */
  .me {
    background-color: var(--color-highlight);
    background-image: radial-gradient(var(--color-dots) 1px, transparent 1.4px);
    background-size: var(--dot-size) var(--dot-size);
    color: var(--color-ink);
  }
  .me-in {
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
    display: flex; flex-direction: column;
    padding: var(--space-9) var(--space-5) var(--space-9) var(--gutter);
  }

  /* Name and a short line. The same pair opens each journey panel, so the columns read alike. */
  .id-name { font: var(--weight-heavy) var(--text-xl)/1.2 var(--font-text); letter-spacing: 0; }
  .id-line { font-size: var(--text-lg); line-height: 1.35; }
  .on-dark .id-line { color: var(--color-on-dark-soft); }

  .motto { margin-top: var(--space-5); font-size: var(--text-4xl); line-height: var(--leading-tight); letter-spacing: -.03em; }
  .motto span { white-space: nowrap; }
  .me-text { margin-top: var(--space-5); max-width: 26em; font-size: var(--text-lg); }

  /* In-page nav: a rail with a bar on the current section. */
  .me-nav { display: grid; margin-top: auto; padding-top: var(--space-6); }
  .me-nav ol { display: grid; border-left: var(--border) solid var(--color-line); }
  .me-nav a {
    display: block; margin-left: calc(var(--border) * -1); padding: var(--space-2) 0 var(--space-2) var(--space-5);
    border-left: var(--space-1) solid transparent;
    font-weight: var(--weight-strong); font-size: var(--text-lg); line-height: 1.35; text-decoration: none; text-underline-offset: 5px;
    transition: border-color var(--dur-fast) var(--ease-out);
  }
  .me-nav a:hover { text-decoration: underline; }
  .me-nav a[aria-current="true"] { border-left-color: var(--color-ink); font-weight: var(--weight-heavy); }

  /* Right column: my work. */
  .work { min-width: 0; padding: var(--space-7); }

  .panel { display: flex; flex-direction: column; padding: var(--space-7); border-radius: var(--radius-md); box-shadow: var(--shadow-panel); }
  .panel + .panel { margin-top: var(--space-7); }
  .panel-maat { min-height: calc(100vh - var(--space-7) * 2); }
  .panel .mission { margin-top: var(--space-5); max-width: 18em; }
  .panel-maat .mission { font-size: var(--text-3xl); line-height: 1.08; letter-spacing: -.02em; max-width: 13em; }
  .panel-context { margin-top: var(--space-4); max-width: var(--measure); color: var(--color-on-dark-soft); }
  /* Extra height in the MAAT panel is shared above and below the seasons. */
  .panel-body { margin-top: auto; padding-block: var(--space-5); }
  .panel-body .label { margin-bottom: var(--space-4); }
  .panel-foot {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-4) var(--space-5);
    margin-top: auto; padding-top: var(--space-5); border-top: 1px solid var(--color-on-dark-line);
  }
  .panel-maat .latest { flex: 1 1 13em; }
  .panel-memory .chapters { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(3, auto); grid-auto-flow: column; gap: var(--space-4) var(--space-6); }
  .panel-memory .soon { color: var(--journey-memory-accent); }

  /* Paper sections below the panels. */
  .block { padding-top: var(--space-9); }
  .block-title { font-size: var(--text-2xl); line-height: var(--leading-snug); }
  .block-lead { margin-top: var(--space-3); max-width: var(--measure); font-size: var(--text-lg); color: var(--color-ink-soft); }

  .principles { margin-top: var(--space-6); border-top: var(--border) solid var(--color-ink); counter-reset: principle; }
  .principle {
    display: grid; grid-template-columns: var(--space-7) minmax(0, 1fr); align-items: baseline;
    padding: var(--space-5) 0; border-bottom: 1px solid var(--color-line); counter-increment: principle;
  }
  .principle::before { content: counter(principle); grid-row: 1 / span 3; font: var(--weight-display) var(--text-xl)/1.2 var(--font-display); color: var(--color-accent-text); }
  .principle > * { grid-column: 2; max-width: var(--measure); }

  .block-small { padding-top: var(--space-8); }
  .block-small .block-title { font-size: var(--text-xl); }
  .built { display: grid; gap: var(--space-3); margin-top: var(--space-4); }

  .work .foot { margin-top: var(--space-8); padding: var(--space-5) 0 0; }

  @media (prefers-reduced-motion: reduce) {
    .me-nav a { transition: none; }
  }

  /* Narrow screens: the left column becomes a short block on top. */
  @media (max-width: 1199px) {
    .layout { display: block; }
    .me-in { position: static; height: auto; overflow: visible; padding: var(--space-6) var(--gutter); }
    .me-nav { display: none; }
    .motto { margin-top: var(--space-4); }
    .me-text { margin-top: var(--space-4); }
    .work { padding: var(--space-5) var(--gutter) var(--space-6); }
    .panel { padding: var(--space-6) var(--space-5); }
    .panel + .panel { margin-top: var(--space-5); }
    .panel-maat { min-height: 0; }
    .block { padding-top: var(--space-8); }
  }
  @media (max-width: 560px) {
    .me-in { padding-top: var(--space-5); padding-bottom: var(--space-5); }
    .me-text { font-size: var(--text-md); }
    .panel-memory .chapters { grid-template-columns: 1fr; grid-template-rows: none; grid-auto-flow: row; }
    .panel-foot { align-items: flex-start; flex-direction: column; }
    .panel-maat .latest { flex: none; }
    .panel-memory .soon { border-radius: var(--radius-sm); }
    .principle { grid-template-columns: var(--space-5) minmax(0, 1fr); }
  }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="app"></div>
<script src="../world/journey/data.js"></script>
<script src="../world/journey/guided/data.js"></script>
<script src="home.js"></script>
<script>
(() => {
  const {esc, person, maat, memory, parts} = HomeKit;
  // The motto breaks only before its last word, so a short word never sits alone on a line.
  const words = person.motto.split(' ');
  const motto = `<span>${esc(words.slice(0, -1).join(' '))}</span> <span>${esc(words.at(-1))}</span>`;
  document.getElementById('app').innerHTML = `
    <div class="layout">
      <header class="me"><div class="me-in">
        <div data-intro>
          <p class="id-name">${esc(person.name)}</p>
          <p class="id-line">${esc(person.role)}.</p>
        </div>
        <div data-intro>
          <h1 class="motto">${motto}</h1>
          <p class="me-text">${esc(person.notDev)}</p>
        </div>
        <nav class="me-nav" aria-label="On this page">
          <ol>
            <li><a href="#maat" aria-current="true">MAAT</a></li>
            <li><a href="#memory">${esc(memory.name)}</a></li>
            <li><a href="#principles">How I think about AI</a></li>
            <li><a href="#built">Also built</a></li>
          </ol>
        </nav>
      </div></header>

      <div class="work">
        <main id="main">
          <section class="panel panel-maat on-dark" id="maat" data-panel="maat" data-intro aria-labelledby="maat-name">
            <div>
              <h2 class="id-name" id="maat-name">${esc(maat.name)}</h2>
              <p class="id-line">My main work</p>
            </div>
            <p class="mission" data-maat-mission>${esc(maat.mission)}</p>
            <p class="panel-context">${esc(maat.context)}</p>
            <div class="panel-body">${parts.seasonList(3)}</div>
            <div class="panel-foot">
              ${parts.latestChapter()}
              ${parts.enter('btn btn-accent')}
            </div>
          </section>

          <section class="panel panel-memory on-dark" id="memory" data-panel="memory" aria-labelledby="memory-name">
            <div>
              <h2 class="id-name" id="memory-name">${esc(memory.name)}</h2>
              <p class="id-line">My research</p>
            </div>
            <p class="mission">${esc(memory.mission)}</p>
            <p class="panel-context">${esc(memory.context)}</p>
            <div class="panel-body">
              <p class="label">Chapters so far</p>
              ${parts.memoryChapters()}
            </div>
            <div class="panel-foot">${parts.soon()}</div>
          </section>

          <section class="block" id="principles" aria-labelledby="principles-title">
            <h2 class="block-title" id="principles-title">How I think about AI</h2>
            <p class="block-lead">${esc(person.mottoLong)}</p>
            <ol class="principles">${parts.principles(3)}</ol>
          </section>

          <section class="block block-small" id="built" aria-labelledby="built-title">
            <h2 class="block-title" id="built-title">Also built</h2>
            <ul class="built">${parts.products()}</ul>
          </section>
        </main>
        ${parts.footer()}
      </div>
    </div>`;

  // The nav in the left column shows the section that is under the top part of the screen.
  const links = [...document.querySelectorAll('.me-nav a')];
  const sections = links.map(a => document.querySelector(a.hash));
  const inBand = new Set();
  let atEnd = false;
  const mark = section => links.forEach(a => {
    if (a.hash === '#' + section.id) a.setAttribute('aria-current', 'true');
    else a.removeAttribute('aria-current');
  });
  const update = () => {
    const current = atEnd ? sections.at(-1) : sections.filter(s => inBand.has(s)).at(-1);
    if (current) mark(current);
  };
  const band = new IntersectionObserver(entries => {
    entries.forEach(e => e.isIntersecting ? inBand.add(e.target) : inBand.delete(e.target));
    update();
  }, {rootMargin: '0px 0px -55% 0px'});
  sections.forEach(s => band.observe(s));
  new IntersectionObserver(([e]) => { atEnd = e.isIntersecting; update(); }, {threshold: 1})
    .observe(document.querySelector('.work .foot'));

  HomeKit.start();
})();
</script>
</body>
</html>
