<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bernat Sampera, AI engineer focused on context</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800;6..12,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="base.css">
<style>
  /* Option A: one column, top to bottom, in order of importance. */
  .wrap { width: 100%; max-width: var(--page-max); margin: 0 auto; padding: 0 var(--gutter); }

  .hero { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: var(--space-5) var(--space-8); align-items: end; padding-top: var(--space-6); padding-bottom: var(--space-7); }
  .hero-who { font-size: var(--text-xl); line-height: var(--leading-snug); }
  .hero-who strong { font-weight: var(--weight-heavy); }
  .hero-motto { margin-top: var(--space-2); font-size: var(--text-4xl); line-height: var(--leading-tight); letter-spacing: -.03em; }
  .hero-text { display: grid; gap: var(--space-3); max-width: var(--measure); font-size: var(--text-lg); }
  .hero-text p:last-child { color: var(--color-ink-soft); }

  .journey { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-7) var(--space-8); padding: var(--space-7); border-radius: var(--radius-md); box-shadow: var(--shadow-panel); }
  .journey + .journey { margin-top: var(--space-6); }
  .journey-name { margin-top: var(--space-2); font-size: var(--text-3xl); line-height: var(--leading-tight); }
  .journey .mission { margin-top: var(--space-4); max-width: 16em; }
  .journey-context { margin-top: var(--space-4); max-width: var(--measure); color: var(--color-on-dark-soft); }
  .journey-act { display: grid; gap: var(--space-5); justify-items: start; margin-top: var(--space-6); }
  .journey-side { align-self: center; }
  .journey-side .label { margin-bottom: var(--space-4); }
  .panel-maat .season-mission { color: var(--color-on-dark); }
  .panel-memory .soon { color: var(--journey-memory-accent); }
  .panel-memory .chapters { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4) var(--space-6); }

  .block { padding-top: var(--space-9); }
  .block-title { font-size: var(--text-3xl); line-height: var(--leading-tight); }
  .block-lead { margin-top: var(--space-3); max-width: var(--measure); font-size: var(--text-lg); color: var(--color-ink-soft); }

  .principles { margin-top: var(--space-6); border-top: var(--border) solid var(--color-ink); }
  .principle { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: var(--space-3) var(--space-8); padding: var(--space-5) 0; border-bottom: 1px solid var(--color-line); }
  .principle-explain { margin-top: 0; max-width: var(--measure); }
  .principle > p { grid-column: 2; }
  .principle-title { grid-row: span 2; }

  #built { padding-top: var(--space-8); }
  #built .block-title { font-size: var(--text-xl); }
  .built { display: flex; flex-wrap: wrap; gap: var(--space-3) var(--space-7); margin-top: var(--space-3); }
  .foot { margin-top: var(--space-9); }

  @media (max-width: 900px) {
    .hero { grid-template-columns: 1fr; padding-top: var(--space-4); padding-bottom: var(--space-6); }
    .journey { grid-template-columns: 1fr; padding: var(--space-6) var(--space-5); gap: var(--space-6); }
    .panel-memory .chapters { grid-template-columns: 1fr; }
    .principle { grid-template-columns: 1fr; }
    .principle > p { grid-column: 1; }
    .principle-title { grid-row: auto; }
    .block { padding-top: var(--space-8); }
  }
  @media (max-width: 560px) {
    .top nav { display: none; }
    .hero-text p:last-child { display: none; }
  }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="app"></div>
<script src="../world/journey/data.js"></script>
<script src="../world/journey/guided/data.js"></script>
<script src="home.js"></script>
<script>
(() => {
  const {esc, person, maat, memory, parts} = HomeKit;
  document.getElementById('app').innerHTML = `
    <header class="top">
      <a class="top-name" href="#main">${esc(person.name)}</a>
      <nav aria-label="On this page">
        <a href="#maat">MAAT</a><a href="#memory">${esc(memory.name)}</a><a href="#principles">How I think</a><a href="#built">Also built</a>
      </nav>
    </header>
    <main id="main" class="wrap">
      <section class="hero" aria-labelledby="motto">
        <div data-intro>
          <p class="hero-who"><strong>${esc(person.name)}</strong>, ${esc(person.role)}.</p>
          <h1 class="hero-motto" id="motto">${esc(person.motto)}</h1>
        </div>
        <div class="hero-text" data-intro>
          <p>${esc(person.notDev)}</p>
          <p>${esc(person.mottoLong)}</p>
        </div>
      </section>

      <section class="journey panel-maat on-dark" id="maat" data-panel="maat" data-intro aria-labelledby="maat-name">
        <div>
          <p class="label">My main work</p>
          <h2 class="journey-name" id="maat-name">${esc(maat.name)}</h2>
          <p class="mission" data-maat-mission>${esc(maat.mission)}</p>
          <p class="journey-context">${esc(maat.context)}</p>
          <div class="journey-act">
            ${parts.latestChapter()}
            ${parts.enter('btn btn-accent')}
          </div>
        </div>
        <div class="journey-side">
          <p class="label">The journey has three parts</p>
          ${parts.seasonList(3)}
        </div>
      </section>

      <section class="journey panel-memory on-dark" id="memory" data-panel="memory" aria-labelledby="memory-name">
        <div>
          <p class="label">My research</p>
          <h2 class="journey-name" id="memory-name">${esc(memory.name)}</h2>
          <p class="mission">${esc(memory.mission)}</p>
          <p class="journey-context">${esc(memory.context)}</p>
          <div class="journey-act">${parts.soon()}</div>
        </div>
        <div class="journey-side">
          <p class="label">Chapters so far</p>
          ${parts.memoryChapters()}
        </div>
      </section>

      <section class="block" id="principles" aria-labelledby="principles-title">
        <h2 class="block-title" id="principles-title">How I think about AI</h2>
        <p class="block-lead">${esc(person.now)}</p>
        <ol class="principles">${parts.principles(3)}</ol>
      </section>

      <section class="block" id="built" aria-labelledby="built-title">
        <h2 class="block-title" id="built-title">Also built</h2>
        <ul class="built">${parts.products()}</ul>
      </section>
    </main>
    ${parts.footer()}`;
  HomeKit.start();
})();
</script>
</body>
</html>
