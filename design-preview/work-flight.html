const works=[
{type:'Project at MAAT',title:'A timetable becomes classes.',sub:'A schedule image becomes editable gym classes.',visual:'schedule',name:'From a gym schedule picture to classes in MAAT',body:'Gym schedules often arrive as pictures. We combined OCR, an editable Markdown table, and structured output. The team checks the result before saving classes.',note:'The image shows a staged review screen.'},
{type:'Project at MAAT',title:'Ask your gym a question.',sub:'The MAAT Admin Agent, from question to answer.',visual:'agent',name:'How we built the MAAT Admin Agent for gym owners',body:'An agent inside the MAAT dashboard helps owners find information about their gym. Jev plans the turn. The model reads data through actions and returns useful widgets.',note:'The scene uses sample names and attendance data.'},
{type:'Article',title:'Give the agent a map.',sub:'Read what the question needs. Leave the rest.',visual:'tree',name:'Global context for AI agents: minimal to load, fast to find',body:'Access to information does not tell an agent where to look. A small index can point to a specific domain. The agent loads the files it needs for the current question.',note:'The scene illustrates a context tree.'},
{type:'Independent project',title:'Find somewhere to train.',sub:'BJJGym, a map for the travelling grappler.',visual:'gym',name:'BJJGym',body:'Find Brazilian jiu-jitsu gyms when you travel. The project brings gym locations and useful details together on a map.',href:'https://bjjgym.com',cta:'Explore BJJGym',note:'The image shows the existing BJJGym map.'},
{type:'Independent project',title:'What survives the session?',sub:'gcontext, a handbook for the next agent.',visual:'context',name:'gcontext',body:'A session ends, but useful knowledge should remain. gcontext stores project information in plain files that people and agents can read. Proposed updates need human review.',note:'The image shows the existing gcontext website.'},
{type:'Open source',title:'Inside a research agent.',sub:'The steps, the context, and the tradeoffs.',visual:'research',name:'event-deep-research',body:'A research agent built with LangGraph. Explore the code and the decisions behind a workflow that breaks research into smaller tasks.',href:'https://github.com/bernatsampera/event-deep-research',cta:'Explore the code',note:'The scene illustrates a research workflow.'}
];
function visual(w){
if(assets[w.visual])return '<div class="visual image-'+w.visual+'"><img src="'+assets[w.visual]+'" alt="'+w.name+'" draggable="false"></div>';
if(w.visual==='agent')return '<div class="visual"><div class="scene chat"><div class="bubble q">Who came to class yesterday?</div><div class="bubble">Class attendance<div class="member-row"><span>Alex</span><span>Evening BJJ</span></div><div class="member-row"><span>Sam</span><span>Evening BJJ</span></div></div><small style="margin-top:12px">Illustrative data</small></div></div>';
if(w.visual==='tree')return '<div class="visual"><div class="scene tree"><div class="file">index.md <span>start here</span></div><div class="file child active">sales/index.md <span>selected</span></div><div class="file child">support/index.md</div><div class="file child">product/index.md</div><small>One question. One path.</small></div></div>';
return '<div class="visual"><div class="scene research"><p>A question becomes<br>a research plan.</p><div class="flow"><span class="node">Question</span><span>›</span><span class="node">Research</span><span>›</span><span class="node">Report</span></div><small>Illustrative workflow, LangGraph</small></div></div>';
}
const field=document.querySelector('#field'),grid=document.querySelector('#grid'),dialog=document.querySelector('#detail');let lastCard;
function card(w,i){const b=document.createElement('button');b.className='work-card';b.innerHTML=visual(w)+'<div class="caption"><div class="meta"><span>'+w.type+'</span><span>View work</span></div><h2>'+w.title+'</h2><p>'+w.sub+'</p></div><span class="card-open" aria-hidden="true">+</span>';b.setAttribute('aria-label','View '+w.name);b.onclick=()=>{lastCard=b;document.querySelector('#detailContent').innerHTML='<div class="detail-grid">'+visual(w)+'<div class="detail-text"><span class="meta">'+w.type+'</span><h2 id="detailTitle">'+w.title+'</h2><p>'+w.body+'</p><p class="source">'+w.name+'</p>'+(w.href?'<a class="pill solid" href="'+w.href+'" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none;margin-top:10px">'+w.cta+'</a>':'')+'<p class="preview-note">'+w.note+' This is a local concept preview.</p></div></div>';dialog.showModal()};return b}
const cards=works.map((w,i)=>{const b=card(w,i);field.append(b);grid.append(card(w,i));return b});
document.querySelector('#close').onclick=()=>dialog.close();dialog.addEventListener('close',()=>lastCard?.focus({preventScroll:true}));dialog.onclick=e=>{if(e.target===dialog)dialog.close()};
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let t=0;const slider=document.querySelector('#travel');
function setView(all){document.body.classList.toggle('all',all);document.querySelector('#allMode').setAttribute('aria-pressed',all);document.querySelector('#flightMode').setAttribute('aria-pressed',!all);window.scrollTo(0,0);update()}
document.querySelector('#allMode').onclick=()=>setView(true);document.querySelector('#flightMode').onclick=()=>setView(false);
function go(v){if(reduced){t=v;update()}else window.scrollTo({top:v/6.5*(document.querySelector('.flight').offsetHeight-innerHeight),behavior:'instant'})}
slider.oninput=()=>go(+slider.value);document.querySelector('#explore').onclick=()=>go(1);document.querySelector('#next').onclick=()=>go(t>=6?0:Math.min(6,Math.floor(t+.15)+1));document.querySelector('#reset').onclick=()=>go(0);document.querySelector('#home').onclick=()=>{setView(false);go(0)};
const canvas=document.querySelector('#face'),ctx=canvas.getContext('2d');let points=[],W=0,H=0;
const photo=new Image();photo.onload=()=>{const off=document.createElement('canvas');off.width=120;off.height=120;const o=off.getContext('2d');o.drawImage(photo,0,0,120,120);const d=o.getImageData(0,0,120,120).data;for(let y=0;y<120;y++)for(let x=0;x<120;x++){const i=(y*120+x)*4;const lum=(d[i]+d[i+1]+d[i+2])/765;if(lum<.84)points.push({x:x/120-.5,y:y/120-.5,r:.22+(1-lum)*.7,z:((x*17+y*31)%97)/97})}update()};photo.src=assets.portrait;
function resize(){W=innerWidth;H=innerHeight;const d=Math.min(devicePixelRatio||1,2);canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0);update()}
function draw(){ctx.clearRect(0,0,W,H);const size=Math.min(H*.94,W*.85);const narrow=W<700;const cx=W*(narrow?.63:.65),cy=H*.51;for(const p of points){const zoom=1+t*(.9+p.z*3);const alpha=Math.max(0,(1-t/2.5)*.8);if(!alpha)break;ctx.fillStyle='rgba(45,48,52,'+alpha+')';ctx.beginPath();ctx.arc(cx+p.x*size*zoom,cy+p.y*size*zoom,Math.min(5,p.r*size/120*(1+t*.4)),0,Math.PI*2);ctx.fill()}if(t>.1){ctx.fillStyle='#abb0b5';for(let i=0;i<100;i++){const x=((i*197.3+t*(i%3-1)*30)%W+W)%W,y=((i*73.7+t*60)%H+H)%H;ctx.globalAlpha=.22;ctx.fillRect(x,y,1.5,1.5)}ctx.globalAlpha=1}}
function update(){if(document.body.classList.contains('all'))return;draw();slider.value=t;document.querySelector('.intro').style.opacity=Math.max(0,1-t*2);document.querySelector('.intro').style.visibility=t>.55?'hidden':'visible';cards.forEach((c,i)=>{const d=i+1-t;const scale=Math.max(.015,1/(1+d*.8));const alpha=d<-.55?0:d<-.12?Math.max(0,1-(-d-.12)/.43):Math.min(1,Math.max(0,(t-.14)*2),Math.max(0,1-d/5));const offset=(W<700?20:125)*Math.sin(i*2.2)*Math.min(1,Math.abs(d)*1.6);const y=H*.02+Math.sin(i*1.8)*45*Math.min(1,Math.abs(d));c.style.transform='translate(calc(-50% + '+offset+'px),calc(-50% + '+y+'px)) scale('+Math.min(scale,2)+') rotate('+(Math.sin(i*2)*Math.min(Math.abs(d),1)*3)+'deg)';c.style.opacity=alpha;c.style.zIndex=100-i;c.style.pointerEvents=alpha>.6&&Math.abs(d)<.65?'auto':'none';c.tabIndex=alpha>.6&&Math.abs(d)<.65?0:-1;c.inert=c.tabIndex<0});const current=Math.max(0,Math.min(5,Math.round(t)-1));document.querySelector('#count').textContent=t<.5?'Scroll to explore':String(current+1).padStart(2,'0')+' / 06';document.querySelector('#hint').textContent=t<.5?'Scroll into the portrait. Select a card to take a closer look.':works[current].type+' / '+works[current].name}
let pending=false;addEventListener('scroll',()=>{if(reduced||pending||document.body.classList.contains('all'))return;pending=true;requestAnimationFrame(()=>{t=Math.max(0,Math.min(6.5,scrollY/(document.querySelector('.flight').offsetHeight-innerHeight)*6.5));update();pending=false})},{passive:true});addEventListener('resize',resize);resize();if(reduced)setView(true);
</script></body></html>
