<!doctype html>
<html lang="en">
<head>

<title>SamperaLabs | Design sketch</title>
<style>
:root{--ink:#191919;--muted:#686868;--line:#e3e3e0;--paper:#fff;--soft:#f6f6f3;--blue:#b5dced}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:16px/1.6 Arial,Helvetica,sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}a{color:inherit;text-underline-offset:5px}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #19739e;outline-offset:4px}button:hover,a:hover{color:#176186}button{min-height:44px}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(38px,5vw,62px);line-height:1.08;letter-spacing:-2.4px;font-weight:600}h2{font-size:29px;line-height:1.25;letter-spacing:-.7px}h3{font-size:21px;line-height:1.3}p{margin-bottom:22px}.small{font-size:13px;color:var(--muted)}.eyebrow{font:11px/1.6 monospace;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.review{background:#222;color:#fff;padding:15px 28px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}.review strong{font-size:13px;white-space:nowrap}.options{display:flex;gap:5px;flex-wrap:wrap}.review button{background:transparent;color:#c8c8c8;border:1px solid #555;border-radius:5px;padding:7px 14px;font-size:12px}.review button[aria-pressed=true]{color:#111;background:#fff;border-color:#fff}.review .small{color:#bbb;margin-left:auto}.decision{background:#f1f1ed;border-bottom:1px solid var(--line);padding:13px 28px;font-size:13px;display:flex;gap:16px;justify-content:space-between}.decision p{margin:0;max-width:950px}.decision a{white-space:nowrap}.shell{max-width:1080px;margin:auto;padding:0 36px}.site-header{display:flex;align-items:center;justify-content:space-between;padding:30px 0;border-bottom:1px solid var(--line);gap:22px}.brand{font-size:15px;font-weight:bold;text-decoration:none;letter-spacing:-.3px}.site-nav{display:flex;gap:24px}.site-nav a{font-size:13px;text-decoration:none}.site-nav a[aria-current=page]{text-decoration:underline}.intro{padding:78px 0 53px}.intro p{max-width:560px;color:var(--muted);font-size:18px;line-height:1.6}.intro h1{max-width:700px}.label-row{display:flex;justify-content:space-between;align-items:baseline;margin:28px 0 8px}.label-row h2{font-size:14px;letter-spacing:0}.label-row a{font-size:12px}.narrow{max-width:710px;margin:auto}.entry{display:grid;grid-template-columns:1fr auto;gap:20px;padding:25px 0;border-top:1px solid var(--line);text-decoration:none}.entry h3{margin:0 0 6px;font-size:21px}.entry p{margin:0;font-size:14px;color:var(--muted)}.entry .small{padding-top:4px;white-space:nowrap}.entry:hover h3{text-decoration:underline;text-decoration-color:var(--blue);text-decoration-thickness:3px}.feature{padding:30px 0 36px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 220px;gap:40px;text-decoration:none}.feature h2{font-size:34px;margin:13px 0}.feature p{color:var(--muted);max-width:520px}.feature-art{background:var(--soft);display:grid;place-items:center;min-height:200px}.feature-art svg{width:100%;max-width:240px}.columns{display:grid;grid-template-columns:1.35fr 1fr;gap:65px}.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:34px;margin-top:20px}.tile{display:block;text-decoration:none}.tile h3{margin:18px 0 7px}.tile p{font-size:14px;color:var(--muted)}.project-image{height:210px;background:var(--soft);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}.project-image img{height:100%;width:100%;object-fit:cover}.project-image .wordmark{font-size:30px;letter-spacing:-1px}.filters{display:flex;gap:10px;margin:0 0 27px;flex-wrap:wrap}.filters button{border:1px solid var(--line);background:#fff;border-radius:30px;padding:7px 18px;font-size:13px}.filters button[aria-pressed=true]{background:var(--ink);color:#fff}.stream .entry{grid-template-columns:92px 1fr 25px}.stream .entry .eyebrow{padding-top:6px}.project-row{display:grid;grid-template-columns:70px 1fr 180px;gap:30px;border-top:1px solid var(--line);padding:32px 0;text-decoration:none}.project-row h2{font-size:32px;margin-bottom:10px}.project-row p{color:var(--muted);font-size:15px;max-width:560px}.project-row .project-image{height:125px}.footer{margin-top:70px;border-top:1px solid var(--line);padding:25px 0 40px;display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:12px}.footer p{margin:0}
.reading{position:relative;padding:0 0 80px}.reading-rail{position:sticky;top:28px;width:190px;float:left;padding-top:75px;font-size:12px}.reading-rail a{display:block;text-decoration:none;color:var(--muted);padding:8px 0}.reading-rail strong{font-size:12px}.reading-rail .eyebrow{margin-bottom:20px}.paper{max-width:660px;margin:0 0 0 280px}.post-head{text-align:center;padding:80px 0 60px}.post-head h1{font-size:52px;line-height:1.14;margin:19px 0 24px}.post-head .subtitle{font-size:18px;color:var(--muted);line-height:1.5}.byline{display:flex;justify-content:center;align-items:center;gap:12px;font-size:13px}.byline img{width:32px;height:32px;object-fit:cover;border-radius:50%}.prose{font:20px/1.8 Georgia,'Times New Roman',serif}.prose p{margin-bottom:27px}.prose h2{font-family:Arial,Helvetica,sans-serif;font-size:31px;line-height:1.3;margin:50px 0 23px;scroll-margin-top:28px}.prose h2 span{box-shadow:inset 0 -3px var(--blue)}.prose figure{margin:35px 0}.prose svg{display:block;width:100%;height:auto;background:#fafaf7;border:1px solid var(--line)}.prose figcaption{font:12px/1.6 Arial,sans-serif;color:var(--muted);text-align:center;margin-top:11px}.prose blockquote{border-left:3px solid var(--blue);margin:38px 0;padding:0 0 0 25px;font-size:25px;line-height:1.5}.mobile-toc{display:none}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:22px 0;font:13px/1.6 Arial,sans-serif}.facts strong{display:block}.workflow{max-width:740px;margin:auto;padding:65px 0}.workflow h1{font-size:43px}.steps{list-style:none;padding:0;counter-reset:step}.steps li{counter-increment:step;display:grid;grid-template-columns:45px 1fr;padding:23px 0;border-top:1px solid var(--line)}.steps li:before{content:'0' counter(step);font:12px monospace;color:var(--muted);padding-top:5px}.steps strong{display:block;margin-bottom:5px}.steps p{margin:0;font-size:15px;color:var(--muted)}.note{background:var(--soft);padding:22px;font-size:14px}.note p:last-child{margin:0}code{font-size:12px;overflow-wrap:anywhere}.mock-label{font:11px monospace;color:var(--muted)}.phone .shell{max-width:390px;padding:0 22px}.phone .site-header{align-items:flex-start;flex-direction:column;gap:12px}.phone .intro{padding-top:45px}.phone h1{font-size:38px;letter-spacing:-1.5px}.phone .columns,.phone .tiles,.phone .feature{grid-template-columns:1fr;gap:20px}.phone .feature-art{min-height:150px}.phone .reading-rail{display:none}.phone .paper{margin:0}.phone .post-head{padding:45px 0 30px}.phone .post-head h1{font-size:38px}.phone .prose{font-size:18px}.phone .mobile-toc{display:block;margin-bottom:30px;font-size:13px}.mobile-toc a{display:block;padding:6px 0}.phone .project-row{grid-template-columns:1fr;gap:12px}.phone .project-row>.eyebrow{display:none}.phone .entry{gap:10px}.phone .entry .small{font-size:11px}.phone .stream .entry{grid-template-columns:1fr}.phone .facts{grid-template-columns:1fr}.phone .footer{flex-direction:column}.phone .workflow h1{font-size:35px}
@media(max-width:760px){.review{padding:13px 18px;gap:10px}.review .small{margin-left:0}.decision{padding:12px 18px;display:block}.decision a{display:inline-block;margin-top:6px}.shell{padding:0 22px}.site-header{align-items:flex-start;flex-direction:column;gap:12px}.intro{padding-top:45px}h1{font-size:38px;letter-spacing:-1.5px}.columns,.tiles,.feature{grid-template-columns:1fr;gap:22px}.feature-art{min-height:150px}.reading-rail{display:none}.paper{margin:0;max-width:100%}.post-head{padding:45px 0 30px}.post-head h1{font-size:38px}.prose{font-size:18px}.mobile-toc{display:block;margin-bottom:30px;font-size:13px}.project-row{grid-template-columns:1fr;gap:12px}.project-row>.eyebrow{display:none}.stream .entry{grid-template-columns:1fr}.facts{grid-template-columns:1fr}.footer{flex-direction:column}.entry .small{font-size:11px}.workflow h1{font-size:35px}}
</style>
</head>
<body>
<div class="review" aria-label="Design review controls"><strong>DESIGN SKETCH / 01</strong><div class="options" id="directions"><button data-direction="A" aria-pressed="true">A · Writing first</button><button data-direction="B" aria-pressed="false">B · Writing + work</button><button data-direction="C" aria-pressed="false">C · One stream</button></div><button id="width" aria-pressed="false">Phone width</button><span class="small">Local preview · Sample copy</span></div>
<div class="decision"><p id="rationale"></p><a href="#workflow">Image principle ↗</a></div>
<div id="canvas"><div class="shell"><header class="site-header"><a class="brand" href="#home">Bernat Sampera<span style="color:#777"> / SamperaLabs</span></a><nav class="site-nav" aria-label="Site preview"><a href="#home" data-page="home">Home</a><a href="#post" data-page="post">Post</a><a href="#portfolio" data-page="portfolio">Portfolio</a></nav></header><main id="main"></main><footer class="footer"><p>Bernat Sampera · Ideas, software, and things I build.</p><a href="#workflow">About this sketch</a></footer></div></div>
<script>
const descriptions={A:'A / Writing first. A short essay list leads the home page. Projects sit below it. The portfolio reads like a set of stories. Best for readers; work takes one more scroll.',B:'B / Writing + work. One featured essay leads into two columns. The portfolio uses image cards. Best for showing what you build; it needs more project images.',C:'C / One stream. Essays and projects share a list with filters. The portfolio is a compact project index. Best for a single growing archive; each type needs a clear label.'};
let direction='A',filter='all';
const essays=[['Everything is context','Give the agent the missing information.','6 min'],['Start with the smallest useful thing','A simple test can teach more than a long plan.','4 min'],['Let the agent ask for help','Keep a person in the loop when a decision matters.','8 min']];
const projects=[['BJJGym','A place to find Brazilian jiu-jitsu gyms.','../../src/assets/images/bjjgym.webp'],['Context Agora','Tools for working with AI and context.',null],['Pack den Sack','A project from the archive.','../../src/assets/images/packdensack.webp']];
const art=`<svg viewBox="0 0 260 210" role="img" aria-label="A small robot carries a large stack of context notes"><g stroke="#282828" stroke-width="2" fill="none" stroke-linecap="round"><rect x="92" y="83" width="72" height="51" rx="14" fill="#fff"/><path d="M127 83V69m-17 65v24m35-24v24m-35 0-17 12m52-12 18 12M93 108l-24-16m95 15 23-16"/><circle cx="127" cy="65" r="4"/><circle cx="113" cy="104" r="3" fill="#282828"/><circle cx="145" cy="104" r="3" fill="#282828"/><path d="M115 119q13 10 27 0"/><path d="m52 79 135-9-3-19-135 9z" fill="#e4eff3"/><path d="m61 56 132-5-4-19-130 5z" fill="#fff"/><path d="M61 185h125"/></g><text x="130" y="201" text-anchor="middle" font-family="monospace" font-size="10" fill="#666">a little context helps.</text></svg>`;
const comic=`<svg viewBox="0 0 660 320" role="img" aria-label="Two robots compare instructions. One has only the word fix. The other has the goal, files, and limits."><path d="M330 20v280" stroke="#ddd"/><g fill="#262626" font-family="Arial,sans-serif" text-anchor="middle"><text x="165" y="36" font-size="13">WHAT I SENT</text><text x="495" y="36" font-size="13">WHAT IT NEEDED</text></g><g stroke="#282828" stroke-width="2.5" fill="white" stroke-linecap="round"><rect x="108" y="149" width="100" height="70" rx="19"/><path d="M159 148v-15m-29 86v37m56-37v37m-56 0-22 11m78-11 23 11m-101-77-23-15m123 15 25-17"/><circle cx="159" cy="128" r="5"/><circle cx="138" cy="179" r="4" fill="#282828"/><circle cx="180" cy="179" r="4" fill="#282828"/><path d="M143 203q15-13 31 0"/><rect x="440" y="149" width="100" height="70" rx="19"/><path d="M490 148v-15m-29 86v37m56-37v37m-56 0-22 11m78-11 23 11m-100-77-23-15m123 15 25-17"/><circle cx="490" cy="128" r="5"/><circle cx="470" cy="179" r="4" fill="#282828"/><circle cx="512" cy="179" r="4" fill="#282828"/><path d="M476 199q15 17 30 0"/><path d="M90 62h141v44h-57l-17 13v-13H90z"/><rect x="385" y="61" width="217" height="48" rx="4" fill="#e8f1f5"/></g><g fill="#262626" font-family="Arial,sans-serif" text-anchor="middle"><text x="160" y="90" font-size="19">fix it.</text><text x="494" y="91" font-size="16">goal + files + limits</text><text x="159" y="301" font-size="13">“I have some questions.”</text><text x="491" y="301" font-size="13">“Now we can work.”</text></g></svg>`;
function essayRows(){return essays.map(e=>`<a class="entry" href="#post"><div><h3>${e[0]}</h3><p>${e[1]}</p></div><span class="small">${e[2]} ↗</span></a>`).join('')}
function projectImage(p){return `<div class="project-image">${p[2]?`<img src="${p[2].replace('../../','../')}" alt="${p[0]} project preview">`:`<span class="wordmark">context agora<span style="color:#777">_</span></span>`}</div>`}
function cards(){return `<div class="tiles">${projects.map((p,i)=>`<a class="tile" href="#project-${i}">${projectImage(p)}<h3>${p[0]} ↗</h3><p>${p[1]}</p></a>`).join('')}</div>`}
function feature(){return `<a href="#post" class="feature"><div><span class="eyebrow">Start here / Essay</span><h2>Everything is context.</h2><p>Give the agent the missing information.</p><span class="small">Read the essay ↗ · 6 min</span></div><div class="feature-art">${art}</div></a>`}
function home(){let intro=`<section class="intro"><p class="eyebrow">Ideas & things I build</p><h1>${direction==='B'?'Think it through.<br>Build it. Share it.':direction==='C'?'A notebook.<br>A place to build.':'Everything<br>is context.'}</h1><p>I’m Bernat. I build software and write about what I learn along the way.</p></section>`;if(direction==='A')return `<div class="narrow">${intro}<div class="label-row"><h2>Writing</h2><span class="eyebrow">Selected essays</span></div>${essayRows()}<div class="label-row" style="margin-top:55px"><h2>Things I build</h2><a href="#portfolio">See portfolio ↗</a></div>${projects.map((p,i)=>`<a class="entry" href="#project-${i}"><div><h3>${p[0]}</h3><p>${p[1]}</p></div><span>↗</span></a>`).join('')}</div>`;if(direction==='B')return intro+feature()+`<div class="columns"><section><div class="label-row"><h2>More writing</h2></div>${essayRows()}</section><section><div class="label-row"><h2>Selected work</h2><a href="#portfolio">All work ↗</a></div><a class="tile" href="#project-0">${projectImage(projects[0])}<h3>BJJGym ↗</h3><p>A place to find your next gym.</p></a></section></div>`;return `<div class="narrow">${intro}${filterControls()}${stream(false)}</div>`}
function filterControls(){return `<div class="filters" aria-label="Filter entries">${[['all','Everything'],['essay','Essays'],['project','Projects']].map(([v,l])=>`<button data-filter="${v}" aria-pressed="${v===filter}">${l}</button>`).join('')}</div>`}
function stream(onlyProjects){let items=onlyProjects?projects.map((p,i)=>({kind:'project',title:p[0],description:p[1],href:'#project-'+i})):[{kind:'essay',title:essays[0][0],description:essays[0][1],href:'#post'},{kind:'project',title:projects[0][0],description:projects[0][1],href:'#project-0'},{kind:'essay',title:essays[1][0],description:essays[1][1],href:'#post'},{kind:'project',title:projects[1][0],description:projects[1][1],href:'#project-1'},{kind:'project',title:projects[2][0],description:projects[2][1],href:'#project-2'}];return `<div class="stream">${items.filter(x=>onlyProjects||filter==='all'||x.kind===filter).map(x=>`<a class="entry" href="${x.href}"><span class="eyebrow">${x.kind}</span><div><h3>${x.title}</h3><p>${x.description}</p></div><span>↗</span></a>`).join('')}</div>`}
function portfolio(){let head=`<section class="intro"><span class="eyebrow">Portfolio / Selected projects</span><h1 style="margin-top:20px">Things I build.</h1><p>Software, small experiments, and the lessons behind them.</p></section>`;if(direction==='B')return head+cards();if(direction==='C')return `<div class="narrow">${head}${stream(true)}</div>`;return head+projects.map((p,i)=>`<a class="project-row" href="#project-${i}"><span class="eyebrow">0${i+1}</span><div><h2>${p[0]} ↗</h2><p>${p[1]}</p><span class="small">Read the project story</span></div>${projectImage(p)}</a>`).join('')}
function contents(project){return project?`<a href="#problem">01 · The problem</a><a href="#build">02 · The build</a><a href="#lesson">03 · What I learned</a>`:`<a href="#missing">01 · The missing piece</a><a href="#picture">02 · Put it in a picture</a><a href="#small">03 · Start small</a>`}
function post(project=false,index=0){const p=projects[index]||projects[0];return `<div class="reading"><aside class="reading-rail"><p class="eyebrow">On this page</p>${contents(project)}<div style="margin-top:28px;border-top:1px solid var(--line);padding-top:16px"><a href="${project?'#portfolio':'#home'}">← ${project?'All projects':'All writing'}</a></div></aside><article class="paper"><header class="post-head"><span class="eyebrow">${project?'Project story':'Essay / AI & software'}</span><h1>${project?p[0]:'Everything<br>is context.'}</h1><p class="subtitle">${project?p[1]:'Give the agent the missing information.'}</p><div class="byline"><img src="../src/assets/images/profile.jpeg" alt=""><span>Written by Bernat Sampera</span><span class="small">· Sample</span></div></header><details class="mobile-toc"><summary>On this page</summary>${contents(project)}</details><div class="prose">${project?`<div class="facts"><div><strong>Format</strong>Project story</div><div><strong>Focus</strong>Problem, build, lesson</div><div><strong>Content</strong>Preview only</div></div><figure>${projectImage(p)}<figcaption>Existing project image. Final story needs your input.</figcaption></figure><h2 id="problem"><span>The problem</span></h2><p>A project page should start with the problem it solves. This space will explain who needed it and what made the work useful.</p><h2 id="build"><span>The build</span></h2><p>Show the product. Explain the main decision. Add a screenshot where it helps the reader understand the work.</p><blockquote>A project is also a story about a decision.</blockquote><h2 id="lesson"><span>What I learned</span></h2><p>End with the result and one useful lesson. Add numbers only when there is evidence for them.</p><p><a href="#portfolio">← Back to the portfolio</a></p>`:`<p><strong>A better answer starts with better context.</strong> You open a new chat. You ask the agent to fix a problem. It gives you a confident answer to a different problem.</p><p>The missing piece might be a file, a past decision, or a limit you forgot to mention.</p><h2 id="missing"><span>The missing piece</span></h2><p>Imagine asking someone to cook dinner. You tell them to make it good. You do not tell them what is in the kitchen.</p><p>That is how we often ask software to help us. We give it a task and leave the useful details in our heads.</p><h2 id="picture"><span>Put it in a picture</span></h2><p>A small picture can make that gap clear.</p><figure>${comic}<figcaption>Original sketch: the same task, with and without context.</figcaption></figure><p>The image has one job: make the point easy to remember. The joke comes from the problem itself.</p><blockquote>Give it the goal, the right files, and the limits.</blockquote><h2 id="small"><span>Start small</span></h2><p>Choose one task. Write down the result you need. Add the information a person would need to do it.</p><p>Then run the task. Use the result to find the next missing piece.</p><p class="mock-label">Design sample. This text is not a published essay.</p><p><a href="#home">← Back to writing</a></p>`}</div></article></div>`}
function workflow(){return `<section class="workflow"><p class="eyebrow">Proposal only / No automation yet</p><h1>One idea.<br>One useful image.</h1><p>Add a funny image when it makes a point easier to understand. Keep the first version small.</p><ol class="steps"><li><div><strong>Pick one moment.</strong><p>The writing agent finds one clear contrast in the draft. Start with at most one image per post.</p></div></li><li><div><strong>Make a visual brief.</strong><p>Record the point, the joke, the position, and the alt text. Use a simple diagram or an original image.</p></div></li><li><div><strong>Create and place the image.</strong><p>A future step creates the asset and adds it after the relevant paragraph. Reuse the existing upload path and Markdown image format.</p></div></li><li><div><strong>Review with the post.</strong><p>Check the image, caption, and meaning together. If the image fails, keep the text draft intact. You review the draft before it is published.</p></div></li></ol><div class="note"><strong>Small input example</strong><p><code>Point: the agent needs context.<br>Image: two robots, one with a vague task, one with useful notes.<br>Position: after the first example.<br>Alt text: two robots compare the information in their instructions.</code></p></div><h2 style="margin-top:45px">What this sketch changes</h2><p>Only local preview files. The site, posts, storage, and deployment stay as they are.</p><p>All essay text and project summaries here are sample copy. The project names and photos come from the repository.</p><h2>Reference</h2><p><a href="https://highagency.com" target="_blank" rel="noreferrer">High Agency by George Mack ↗</a>: a clear reading column, strong headings, a contents rail, and images within the story.</p><h2>Next decision</h2><p>Pick A, B, or C. You can mix a home page from one option with a portfolio from another. The post design is shared.</p><a href="#home">← Back to the sketch</a></section>`}
function render(){const route=(location.hash.slice(1)||'home');if(['missing','picture','small','problem','build','lesson'].includes(route))return;const isProject=route.startsWith('project-');const page=isProject?'project':['home','post','portfolio','workflow'].includes(route)?route:'home';document.getElementById('rationale').textContent=descriptions[direction];document.querySelectorAll('[data-direction]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.direction===direction)));document.querySelectorAll('[data-page]').forEach(a=>{if(a.dataset.page===(isProject?'portfolio':page))a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});document.getElementById('main').innerHTML=page==='home'?home():page==='portfolio'?portfolio():page==='workflow'?workflow():post(isProject,Number(route.split('-')[1]));document.title='SamperaLabs | '+direction+' | '+page;}
document.addEventListener('click',e=>{const d=e.target.closest('[data-direction]');if(d){direction=d.dataset.direction;render()}const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;render()}});document.getElementById('width').onclick=e=>{let narrow=document.getElementById('canvas').classList.toggle('phone');e.currentTarget.setAttribute('aria-pressed',String(narrow));e.currentTarget.textContent=narrow?'Full width':'Phone width'};window.addEventListener('hashchange',()=>{render();if(!['missing','picture','small','problem','build','lesson'].includes(location.hash.slice(1)))window.scrollTo(0,0)});render();
</script>
</body>
</html>
