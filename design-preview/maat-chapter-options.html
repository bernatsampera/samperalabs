:root{--ink:#14141a;--body:#3c3c43;--muted:#5f5f67;--line:#e2e2e6;--soft:#f2f2f4;--paper:#fff;--blue:#1d5bff;--wash:#edf2ff}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--soft);font:400 16px/1.5 Geist,Arial,sans-serif}button,a,input{font:inherit}button{color:inherit;cursor:pointer}button:disabled{cursor:default;opacity:.4}button,a{-webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:4px}button{touch-action:manipulation}button:hover:not(:disabled){border-color:var(--ink)}[hidden]{display:none!important}h1,h2,h3,p,figure{margin:0}h1,h2,h3{font-weight:500;letter-spacing:-.035em;line-height:1.12}button{border:1px solid var(--line);background:var(--paper)}svg{display:block;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}a{color:inherit}small,.small{font-size:12px;line-height:1.5}.muted{color:var(--muted)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.review-bar{background:var(--ink);color:white;padding:10px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:64px}.review-brand{font-size:13px;white-space:nowrap}.review-brand span{color:#b7b7bf;margin-left:12px}.options{display:flex;gap:6px}.options button{min-height:42px;padding:8px 16px;border-color:#44444b;background:transparent;color:#d5d5dc;border-radius:8px;font-size:13px}.options button[aria-pressed=true]{background:white;color:var(--ink);border-color:white}.options button:hover{border-color:white!important}.review-note{display:flex;justify-content:space-between;gap:16px;padding:8px 24px;background:white;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}.review-note strong{font-weight:500;color:var(--ink)}
.shell{height:calc(100dvh - 99px);min-height:610px;max-width:1600px;margin:auto;padding:0 40px;display:grid;grid-template-rows:66px 56px minmax(0,1fr) 64px;gap:0}.top{display:flex;align-items:center;justify-content:space-between;gap:24px}.identity{display:flex;align-items:center;gap:20px}.back{display:flex;align-items:center;gap:8px;border-radius:22px;min-height:40px;padding:8px 14px;font-size:14px}.back svg{width:16px;height:16px}.category{font-size:16px;font-weight:500}.date{font-size:13px;color:var(--muted)}.projects{display:flex;gap:28px;align-items:stretch;border-bottom:1px solid var(--line)}.projects button{display:flex;align-items:center;gap:10px;border:0;border-bottom:2px solid transparent;background:none;padding:8px 2px 12px;font-size:14px;color:var(--muted)}.projects button[aria-pressed=true]{border-bottom-color:var(--ink);color:var(--ink)}.index{width:22px;height:22px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;font-size:11px}.projects button[aria-pressed=true] .index{background:var(--ink);color:white;border-color:var(--ink)}

const icons={arrow:'<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>'};
const notes={a:'<strong>A / Project + proof.</strong> The role, result, and product screen share one view.',b:'<strong>B / Before / after.</strong> The change leads. Two diagrams explain the difference.',c:'<strong>C / Guided steps.</strong> Select a step to see its screen and purpose.'};
let option='a',project='schedule',step=1;
const stage=document.getElementById('stage');
const modal=document.getElementById('modal');
const metric=()=>'<div class="metric"><span class="old"><b>30</b> min</span><span aria-hidden="true">→</span><span><b>5</b> min</span><small>approximately</small></div>';
const facts=()=>project==='schedule'?'<dl class="facts"><div class="fact"><dt>Problem</dt><dd>The team entered every class by hand.</dd></div><div class="fact"><dt>My work</dt><dd>I built image import with a review step before the team saves the classes.</dd></div><div class="fact"><dt>Result</dt><dd>'+metric()+'</dd></div></dl>':'<dl class="facts"><div class="fact"><dt>Problem</dt><dd>A new gym brings data from its old software.</dd></div><div class="fact"><dt>My work</dt><dd>I took responsibility for migrations and used my own AI workflow to help move the data into MAAT.</dd></div><div class="fact"><dt>Scope</dt><dd>The project notes describe the work, but give no measured time reduction.</dd></div></dl>';
const article=()=>project==='schedule'?'<button class="text-button" data-article>Read the article ↗</button>':'<span class="small muted">A full article is not available yet.</span>';
function screen(src,title,caption){return '<figure class="evidence"><div class="screen-frame"><div class="screen-title"><span><i></i><i></i><i></i></span>'+title+'<span>MAAT</span></div><button class="screen-image" data-image="'+src+'" aria-label="Enlarge '+title+'"><img src="'+assets[src]+'" alt="'+caption+'"></button></div><div class="visual-footer"><figcaption>'+caption+'</figcaption><button data-image="'+src+'">Enlarge ↗</button></div></figure>'}
function graphic(kind){
const frame=(title,body)=>'<svg viewBox="0 0 500 200" role="img" aria-label="'+title+'">'+body+'</svg>';
if(kind==='manual')return frame('Manual entry: a schedule picture beside separate class fields.','<rect class="paper" x="24" y="20" width="162" height="158" rx="9"/><text x="40" y="46">Weekly schedule</text><path d="M40 61h130M40 80h130M40 106h130M40 132h130M82 61v98M126 61v98" stroke="#d3d3da"/><path class="fine" d="M211 100h46m-7-7 7 7-7 7"/><g class="paper"><rect x="282" y="22" width="192" height="40" rx="6"/><rect x="282" y="80" width="192" height="40" rx="6"/><rect x="282" y="138" width="192" height="40" rx="6"/></g><text x="296" y="47">Class name</text><text x="296" y="105">Start time</text><text x="296" y="163">End time</text><path class="fine" d="M390 36v14"/>');
if(kind==='review')return frame('Review: AI prepares a table, then a person checks class names and times.','<rect class="paper" x="30" y="22" width="440" height="156" rx="10"/><text x="49" y="48">Proposed classes</text><text x="304" y="48">Person checks</text><path d="M30 63h440M30 101h440M30 139h440" stroke="#e2e2e6"/><text x="49" y="87">BJJ Fundamentals</text><text x="240" y="87">18:00</text><text x="49" y="125">Open Mat</text><text x="240" y="125">19:00</text><text x="49" y="163">No-Gi</text><text x="240" y="163">18:00</text><g class="blue"><path d="m414 80 5 5 9-10m-14 48 5 5 9-10m-14 48 5 5 9-10"/></g>');
return frame('Conceptual view: existing gym data moves from another provider into MAAT.','<rect class="paper" x="34" y="35" width="152" height="130" rx="10"/><text x="54" y="65">Other provider</text><path class="fine" d="M54 88h105M54 108h82M54 128h96"/><path class="fine" d="M211 100h72m-8-8 8 8-8 8"/><rect class="paper" x="309" y="35" width="152" height="130" rx="10"/><text x="329" y="65">MAAT</text><path class="fine" d="M329 88h105M329 108h82M329 128h96"/>');
}
function layoutA(){return '<div class="split"><div class="copy"><p class="kicker">'+(project==='schedule'?'01 / Schedule import':'02 / AI migrations')+'</p><h1>'+(project==='schedule'?'From a schedule photo<br>to editable classes.':'Bring a gym’s data<br>into MAAT.')+'</h1>'+facts()+article()+'</div>'+(project==='schedule'?screen('editor','Editable classes','Staged product screen with fictional schedule data.'):('<figure class="evidence"><div class="diagram">'+graphic('migration')+'</div><figcaption>Conceptual view. The internal migration process is not shown.</figcaption></figure>'))+'</div>'}
function layoutB(){const schedule=project==='schedule';return '<div class="result-head"><div><p class="kicker">'+(schedule?'01 / Schedule import':'02 / AI migrations')+'</p><h1>'+(schedule?'From entering classes<br>to checking them.':'The gym changes software.<br>Its data needs to follow.')+'</h1></div>'+(schedule?metric():'<span class="tag">AI-assisted migrations</span>')+'</div><div class="comparison"><section class="compare-card"><div class="compare-label"><span>01 / '+(schedule?'Before':'Source')+'</span><span>'+(schedule?'Manual entry':'Existing information')+'</span></div><h2>'+(schedule?'Copy each class.':'Data from another provider.')+'</h2><div class="diagram">'+graphic(schedule?'manual':'migration')+'</div><p class="explanation">'+(schedule?'The team reads the schedule picture and enters each class into MAAT.':'A new gym brings its existing data when it moves to MAAT.')+'</p></section><section class="compare-card after"><div class="compare-label"><span>02 / '+(schedule?'With the tool':'My work')+'</span><span class="tag">'+(schedule?'Human review':'Process ownership')+'</span></div><h2>'+(schedule?'Check proposed classes.':'Own the migration workflow.')+'</h2><div class="diagram">'+graphic(schedule?'review':'migration')+'</div><p class="explanation">'+(schedule?'AI prepares the data. The team checks the text and edits the classes before saving.':'I took responsibility for the process and used my own AI workflow to help move the data.')+'</p></section></div><div class="result-bottom"><p>'+(schedule?'Simplified diagrams with fictional data. The article reports about 30 minutes reduced to five per schedule.':'Conceptual diagrams. The notes do not describe the implementation or measured results.')+'</p>'+article()+'</div>'}
const steps=[{name:'Read the picture',hint:'Image → text',asset:'source',title:'Start with the gym’s schedule.',copy:'The tool reads the picture into an editable text table.',caption:'Fictional source schedule from the article.'},{name:'Check the text',hint:'Human review',asset:'review',title:'Review before conversion.',copy:'The team checks class names and times beside the original picture.',caption:'Staged frontend view with fictional data. OCR did not run for this capture.'},{name:'Edit the classes',hint:'Text → class fields',asset:'editor',title:'Keep the final check with the team.',copy:'The tool converts the checked text into class fields. The team can edit them before saving.',caption:'Staged frontend view with a mock conversion response. No schedule was saved.'}];
function layoutC(){if(project!=='schedule')return '<div class="process-head"><div><p class="kicker">02 / AI migrations</p><h1>One owner for the migration.</h1></div></div><div class="split"><div class="copy">'+facts()+'</div><figure class="evidence"><div class="diagram">'+graphic('migration')+'</div><figcaption>The source does not describe individual migration steps. This preview does not invent them.</figcaption></figure></div>';const s=steps[step];return '<div class="process-head"><div><p class="kicker">01 / Schedule import</p><h1>A picture becomes a schedule.</h1></div>'+metric()+'</div><div class="process-layout"><nav class="step-list" aria-label="Schedule import steps">'+steps.map((s,i)=>'<button class="step-button" data-step="'+i+'" aria-pressed="'+(i===step)+'"><span class="step-number">'+(i+1)+'</span><span><strong>'+s.name+'</strong><small>'+s.hint+'</small></span></button>').join('')+'</nav><div class="evidence"><div class="screen-frame"><div class="screen-title">'+s.title+'<button class="text-button" style="min-height:24px;padding:0;font-size:12px" data-image="'+s.asset+'">Enlarge ↗</button></div><button class="screen-image" data-image="'+s.asset+'" aria-label="Enlarge the '+s.name.toLowerCase()+' screen"><img src="'+assets[s.asset]+'" alt="'+s.caption+'"></button></div><div class="process-caption"><div><p>'+s.copy+'</p><p class="small">'+s.caption+'</p></div><button class="pill" data-step="'+((step+1)%3)+'">'+(step===2?'Start again':'Next step')+' →</button></div></div></div>'}
function render(announce=true){document.getElementById('option-note').innerHTML=notes[option];document.querySelectorAll('[data-option]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.option===option));document.querySelectorAll('[data-project]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.project===project));stage.innerHTML=option==='a'?layoutA():option==='b'?layoutB():layoutC();document.getElementById('project-date').textContent=project==='schedule'?'February 2026':'Start month to confirm';document.getElementById('previous').disabled=project==='schedule';document.getElementById('next').disabled=project==='migration';document.getElementById('next').textContent=project==='schedule'?'AI migrations →':'End of this part';document.getElementById('where').textContent=project==='schedule'?'Schedule import / Internal tools':'AI migrations / Internal tools';if(announce)document.getElementById('announcement').textContent='Option '+option.toUpperCase()+'. '+(project==='schedule'?'Schedule import':'AI migrations')+(option==='c'&&project==='schedule'?'. '+steps[step].name:'');}
function openModal(title,body){document.getElementById('modal-title').textContent=title;document.getElementById('modal-body').innerHTML=body;modal.showModal()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.option){option=b.dataset.option;render()}else if(b.dataset.project){project=b.dataset.project;render()}else if(b.dataset.step!==undefined){const wasStep=b.classList.contains('step-button');step=Number(b.dataset.step);render();if(wasStep)stage.querySelector('[data-step="'+step+'"]').focus();else stage.querySelector('.process-caption [data-step]').focus()}else if(b.dataset.image){openModal('Schedule import: '+(b.dataset.image==='source'?'source picture':b.dataset.image==='review'?'text review':'class editor'),'<img src="'+assets[b.dataset.image]+'" alt="Staged schedule import example with fictional data."><p class="small muted">Fictional data from the article demonstration.</p>')}else if(b.hasAttribute('data-article')){openModal('From a gym schedule picture to classes in MAAT','<p>When a new gym joined MAAT, our sales team received a picture of its weekly schedule. Then someone entered every class into the app, one field at a time.</p><p>Our product team built an import tool that reduced this task from about 30 minutes to about five minutes.</p><p>The solution combines two steps: read the image into an editable table, then convert that table into the data MAAT needs. That table gives the team a place to correct errors.</p><p class="article-note">Article excerpt. Local source: src/editorial/drafts/gym-schedule-import/article.md</p>')}else if(b.id==='overview'){openModal('Enabling AI across MAAT','<p>I help the whole company use AI: how the team works, how it shares knowledge, and what gym owners can do with our software.</p><div class="overview-grid"><section><span class="small muted">01 / For the team</span><h3>Internal tools</h3><p>Schedule import and AI workflows for data migrations.</p><button class="pill solid" id="return-project">Explore →</button></section><section><span class="small muted">02 / For the team</span><h3>MAAT Brain</h3><p>Company knowledge, service connections, and approved procedures.</p></section><section><span class="small muted">03 / For gym owners</span><h3>Admin Agent</h3><p>Questions about gym data inside the MAAT dashboard.</p></section></div>')}else if(b.id==='return-project'||b.classList.contains('close'))modal.close();else if(b.id==='previous'){project='schedule';render();document.querySelector('[data-project="schedule"]').focus()}else if(b.id==='next'){project='migration';render();document.querySelector('[data-project="migration"]').focus()}});
modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)modal.close()}});
render(false);
</script>
