<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hero D: a face made of context</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../design-system/tokens.css">
<link rel="stylesheet" href="../shared.css">
<style>
  /* D: the portrait is drawn with the text of the site. Four regions of the face hold four themes.
     Scroll or click toward a point and the letters become lines. */
  .stage { width: min(var(--column), 100% - 2 * var(--gutter)); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s-8); align-items: center; }
  .intro { display: flex; flex-direction: column; gap: var(--s-5); min-width: 0; }
  .intro h1 { text-align: left; max-width: none; }
  .intro .lede { text-align: left; max-width: 360px; }
  .readout { display: flex; flex-direction: column; gap: var(--s-2); font-size: var(--type-meta); line-height: var(--leading-meta); color: var(--slate); font-variant-numeric: tabular-nums; }
  .readout b { font-weight: var(--weight-medium); color: var(--ink); }
  .where { position: relative; display: inline-flex; align-items: center; gap: var(--s-2); min-height: 18px; padding-left: 14px; transition: color var(--d-fast); }
  .where i { position: absolute; left: 0; top: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: 0; transform: scale(.4); transition: opacity 240ms, transform 240ms var(--ease-out); }
  .where.on { color: var(--ink); font-weight: var(--weight-medium); }
  .where.on i { opacity: 1; transform: none; }
  .figure { --fig: min(480px, 100svh - 330px); position: relative; width: var(--fig); height: var(--fig); }
  canvas.face { display: block; width: 100%; height: 100%; cursor: zoom-in; touch-action: manipulation; }
  canvas.face.zoomed { cursor: zoom-out; }
  .back { position: absolute; left: 50%; bottom: var(--s-3); transform: translateX(-50%); display: inline-flex; align-items: center; height: 32px; padding: 0 var(--s-3); border-radius: var(--r-pill); border: 1px solid var(--rule); background: var(--paper); font-size: var(--type-small); line-height: var(--leading-small); font-weight: var(--weight-medium); white-space: nowrap; cursor: pointer; box-shadow: 0 1px 2px rgba(15, 15, 18, .04), 0 8px 24px rgba(15, 15, 18, .06); }
  .back:hover { border-color: var(--ink); }
  .back[hidden] { display: none; }
  @media (max-width: 809px) {
    .stage { grid-template-columns: 1fr; justify-items: center; gap: var(--s-5); }
    .intro { align-items: center; gap: var(--s-3); order: 2; }
    .intro h1 { font-size: var(--type-display-phone); line-height: var(--leading-display-phone); letter-spacing: -.6px; text-align: center; }
    .intro .lede { text-align: center; font-size: var(--type-body); line-height: var(--leading-body); }
    .readout { align-items: center; }
    .figure { --fig: min(100vw - 48px, 360px); order: 1; }
  }
</style>
</head>
<body>
<main class="hero">
  <div id="nav"></div>
  <section class="hero-view">
    <div class="stage">
      <div class="intro">
        <h1>Bernat Sampera</h1>
        <p class="lede">AI engineer. Everything is information.</p>
        <div class="readout">
          <div class="count" data-count></div>
          <div class="where" data-where><i></i><span></span></div>
        </div>
      </div>
      <div class="figure">
        <canvas class="face" role="img" aria-label="A portrait of Bernat drawn with the text of this site. Scroll or click into it to read the lines."></canvas>
        <button type="button" class="back" data-back hidden>Back to the face</button>
      </div>
    </div>
  </section>
  <div id="dock"></div>
</main>
<script src="../shared.js"></script>
<script src="photo.js"></script>
<script src="fragments.js"></script>
<script src="face.js"></script>
</body>
</html>
