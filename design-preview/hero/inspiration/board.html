<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero inspiration: faces on awwwards portfolios</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../design-system/tokens.css">
<style>
  body { margin: 0; padding: 40px 24px 80px; background: #F2F2F4; color: var(--color-ink); font: 400 16px/26px var(--font-sans); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1400px; margin: 0 auto; }
  h1 { margin: 0 0 8px; font-size: 42px; line-height: 48px; letter-spacing: -.8px; font-weight: 500; }
  .lede { margin: 0 0 40px; color: var(--color-graphite); max-width: 760px; }
  h2 { margin: 48px 0 16px; font-size: 21px; line-height: 27px; font-weight: 500; }
  .row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
  figure { margin: 0; }
  figure img { display: block; width: 100%; border: 1px solid #E2E2E6; border-radius: 8px; background: #fff; }
  figcaption { margin-top: 8px; font-size: 14px; line-height: 20px; color: var(--color-graphite); }
  figcaption b { color: var(--color-ink); font-weight: 500; }
  figcaption a { color: var(--color-accent); text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Faces in the hero, awwwards portfolios</h1>
  <p class="lede">Screenshots taken on 2026-11-01 at 1440 by 900. Grouped by how the face is used. Aesthetics only.</p>

  <h2>1. The face under the name</h2>
  <div class="row">
    <figure><img src="shots/snellenberg.png" alt=""><figcaption><b>Dennis Snellenberg</b> <a href="https://dennissnellenberg.com/">dennissnellenberg.com</a>. Cut-out photo on flat gray. The name at display size crosses the body and runs off the edge. One role line, small. A dark location pill. Nothing else.</figcaption></figure>
    <figure><img src="shots/corral.png" alt=""><figcaption><b>Ray Corral</b> <a href="https://raycorral.com/">raycorral.com</a>. Black and white portrait, arms on the table, looking at you. The name fills the width above the head. An ink blot behind the head. Three role lines at the left, one sentence at the right.</figcaption></figure>
  </div>

  <h2>2. The portrait is the whole screen</h2>
  <div class="row">
    <figure><img src="shots/hellmann.png" alt=""><figcaption><b>David Hellmann</b> <a href="https://davidhellmann.com/">davidhellmann.com</a>. Full-bleed black and white face, cropped tight. The nav floats as a pill over the forehead. The content card rises over the chin.</figcaption></figure>
    <figure><img src="shots/shehata.png" alt=""><figcaption><b>Mohamed Shehata</b> <a href="https://mohamedshehata.net/">mohamedshehata.net</a>. Full-bleed warm portrait with one visual twist. Name and nav in one floating pill. The twist does the talking.</figcaption></figure>
  </div>

  <h2>3. Editorial</h2>
  <div class="row">
    <figure><img src="shots/petersand.png" alt=""><figcaption><b>Peter Sand</b> <a href="https://petersand.eu/">petersand.eu</a>. Newspaper masthead: the name as the title, a rule, a nav line, then a text column and a photo column. Paper ground, serif, one red.</figcaption></figure>
    <figure><img src="shots/miranda.png" alt=""><figcaption><b>Niccolò Miranda</b> <a href="https://www.niccolomiranda.com/">niccolomiranda.com</a>. Same newspaper idea without a face: the name is the masthead at the bottom of the first screen.</figcaption></figure>
  </div>

  <h2>4. The face as material</h2>
  <div class="row">
    <figure><img src="shots/carazan.png" alt=""><figcaption><b>Vadim Carazan</b> <a href="https://vadimcarazan.com/">vadimcarazan.com</a>. The portrait is made of thousands of small squares that move. A serif name at the bottom. Dark. The closest to "a person made of information", and also the most common AI look.</figcaption></figure>
    <figure><img src="shots/roman.png" alt=""><figcaption><b>Roman Serebryakov</b> <a href="https://roman-loves.design">roman-loves.design</a>. A round portrait sits inside huge statement text. The text shows through the circle.</figcaption></figure>
  </div>

  <h2>5. Loud and handmade</h2>
  <div class="row">
    <figure><img src="shots/strike.png" alt=""><figcaption><b>Strike Heredia</b> <a href="https://strike.uno/">strike.uno</a>. Scrapbook: a polaroid photo, stickers, a name tag, numbers. Red and green.</figcaption></figure>
    <figure><img src="shots/kristi.png" alt=""><figcaption><b>Kristina Volchek</b> <a href="https://kristi.digital/">kristi.digital</a>. Photo cut-out with sticker shapes and a big statement.</figcaption></figure>
  </div>

  <h2>6. Avatars (for contrast)</h2>
  <div class="row">
    <figure><img src="shots/poulo.png" alt=""><figcaption><b>Poulo</b> <a href="https://www.poulo.site/">poulo.site</a>. Drawn avatar instead of a photo.</figcaption></figure>
    <figure><img src="shots/yakushev.png" alt=""><figcaption><b>Artiom Yakushev</b> <a href="https://www.art-yakushev.com/">art-yakushev.com</a>. No face: the name set in two faces, sans and italic serif, over the work.</figcaption></figure>
  </div>
</div>
</body>
</html>
