:root { --canvas:#f5f5f7; --paper:#fff; --ink:#17181c; --muted:#62646d; --rule:#dedfe4; --accent:#245bff; --bar:72px; font-family:Geist,sans-serif; color:var(--ink); background:var(--canvas); scroll-behavior:smooth; scroll-padding-top:calc(var(--bar) + 24px); }
* { box-sizing:border-box; }
body { margin:0; }
a { color:inherit; text-underline-offset:4px; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
:focus-visible { outline:3px solid var(--accent); outline-offset:5px; }
.skip { position:fixed; z-index:20; top:8px; left:8px; transform:translateY(-160%); padding:12px; background:white; }
.skip:focus { transform:none; }
.page-nav { position:sticky; top:0; z-index:5; min-height:var(--bar); border-bottom:1px solid var(--rule); background:rgba(245,245,247,.98); }
.nav-inner { width:min(1040px,calc(100% - 80px)); margin:auto; min-height:var(--bar); display:flex; align-items:center; gap:32px; }
.brand { font-size:18px; font-weight:650; letter-spacing:-.4px; text-decoration:none; padding:12px 0; }
.area-nav { display:flex; margin-left:auto; gap:24px; align-items:center; }
.area-nav a { display:flex; align-items:center; min-height:44px; font-size:13px; line-height:20px; color:var(--muted); text-decoration:none; border-bottom:2px solid transparent; }
.area-nav a:hover { color:var(--ink); }
.area-nav a[aria-current] { color:var(--ink); border-color:var(--ink); }
main { width:min(1040px,calc(100% - 80px)); margin:auto; padding-bottom:64px; }
.intro { max-width:800px; padding:56px 0 32px; }
h1 { font-size:clamp(36px,4vw,48px); line-height:1.08; letter-spacing:-1.7px; font-weight:550; margin:0 0 20px; text-wrap:balance; }
.intro p { max-width:680px; font-size:17px; line-height:27px; color:#555862; margin:0; }
.overview { padding-bottom:64px; }
.timeline-groups { display:grid; grid-template-columns:2fr 2fr 1fr; gap:24px; margin-bottom:16px; }
.timeline-groups a { font-size:14px; font-weight:550; text-decoration:none; padding:8px 0; border-bottom:1px solid var(--rule); }
.timeline-stops { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); list-style:none; margin:0; padding:0; }
.timeline-stops li { position:relative; }
.timeline-stops li:before { content:''; position:absolute; left:0; right:0; top:33px; height:1px; background:#c5c9d2; }
.timeline-stops li:first-child:before { left:12px; }
.timeline-stops li:last-child:before { right:calc(100% - 12px); }
.timeline-stops a { position:relative; display:flex; flex-direction:column; gap:23px; min-height:90px; padding:0 16px 8px 0; text-decoration:none; }
.timeline-stops a:after { content:''; position:absolute; left:7px; top:28px; width:10px; height:10px; border:2px solid var(--ink); border-radius:50%; background:var(--canvas); box-shadow:0 0 0 4px var(--canvas); }
.timeline-stops a:hover:after { background:var(--accent); border-color:var(--accent); }
.timeline-date { font-size:12px; line-height:18px; color:var(--muted); }
.timeline-name { font-size:13px; line-height:19px; font-weight:450; max-width:150px; }
.journey { position:relative; isolation:isolate; }
.route { position:absolute; z-index:-1; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
.route path { fill:none; stroke:#c4cad7; stroke-width:1.5; stroke-linecap:round; }
.work-area { scroll-margin-top:calc(var(--bar) + 24px); }

function sideFor(index) {

}
function preview(index) {

journey.innerHTML = '<svg class="route" aria-hidden="true"><path class="route-base"/><path class="route-read"/><circle class="route-cursor" r="5"/></svg>' + groups.map((name, group) => '<section class="work-area" id="' + areaIds[group] + '" aria-labelledby="title-' + group + '"><header class="area-header"><h2 class="area-title" id="title-' + group + '">' + name + '</h2><p class="area-intro">' + projectIntros[group] + '</p></header>' + work.map((item,index) => item.group !== group ? '' : '<div class="work-step step-' + index + '" id="stop-' + item.id + '" data-index="' + index + '" data-side="' + sideFor(index) + '">' + marker(item) + preview(index) + '</div>').join('') + '</section>').join('');

const routeBase = journey.querySelector('.route-base');
const routeRead = journey.querySelector('.route-read');

let routeLength = 0;
let routePoints = [];

function draw() {
  const bounds = journey.getBoundingClientRect();
  const points = steps.map(step => {
    const dot = step.querySelector('.marker').getBoundingClientRect();
    const row = step.getBoundingClientRect();
    return {x:dot.left - bounds.left + dot.width/2, y:dot.top - bounds.top + dot.height/2, top:row.top - bounds.top, bottom:row.bottom - bounds.top};
  });
  const svg = journey.querySelector('.route');
  svg.setAttribute('viewBox', '0 0 ' + bounds.width + ' ' + bounds.height);
  let path = 'M' + points[0].x + ' ' + points[0].y;
  points.slice(1).forEach((point,index) => {
    const previous = points[index];
    const tangent = (point.y - previous.y) * .5;
    path += 'C' + previous.x + ' ' + (previous.y + tangent) + ' ' + point.x + ' ' + (point.y - tangent) + ' ' + point.x + ' ' + point.y;

function update() {
  const baseReadingLine = Math.min(innerHeight * .4, 340);
  const scrollEnd = Math.max(0, document.documentElement.scrollHeight - innerHeight);
  const remaining = Math.max(0, scrollEnd - scrollY);
  const complete = remaining <= 2;

  const finalAtBottom = finalBounds.top + finalBounds.height / 2 - remaining;
  const finishWindow = Math.min(innerHeight * .6, Math.max(200, finalStep.offsetHeight));
