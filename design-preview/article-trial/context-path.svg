<svg xmlns="http://www.w3.org/2000/svg" width="420" height="552" viewBox="0 0 420 552" role="img" aria-labelledby="title description">
  <title id="title">One question leads to the relevant files</title>
  <desc id="description">A membership question leads to the context index, then to an investigation procedure. The procedure points to billing and database knowledge. This is a concept diagram.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#71717a" stroke-width="1.3"/></marker>
  </defs>
  <style>
    text { font-family: Poppins, Arial, sans-serif; fill: #18181b; }
    .label { font-size: 20px; font-weight: 500; }
    .note { font-size: 18px; fill: #52525b; }
    .route { fill: none; stroke: #71717a; stroke-width: 1.6; marker-end: url(#arrow); }
  </style>
  <rect width="420" height="552" fill="white"/>
  <rect x="10" y="8" width="400" height="88" rx="10" fill="#18181b"/>
  <text x="210" y="43" text-anchor="middle" style="fill:white;font-size:23px;font-weight:500">Why is this membership</text>
  <text x="210" y="74" text-anchor="middle" style="fill:white;font-size:23px;font-weight:500">missing?</text>
  <path class="route" d="M210 97 V145"/>
  <rect x="10" y="155" width="400" height="80" rx="8" fill="#f4f4f5"/>
  <text x="32" y="187" class="label">index.md</text>
  <text x="32" y="216" class="note">Find the investigation procedure.</text>
  <path class="route" d="M210 236 V284"/>
  <rect x="10" y="294" width="400" height="80" rx="8" fill="#f4f4f5"/>
  <text x="32" y="326" class="label">investigate-membership.md</text>
  <text x="32" y="355" class="note">Identify the knowledge needed.</text>
  <path class="route" d="M210 375 V397 H107 V424"/>
  <path class="route" d="M210 397 H313 V424"/>
  <rect x="10" y="434" width="194" height="66" rx="8" fill="white" stroke="#a1a1aa"/>
  <rect x="216" y="434" width="194" height="66" rx="8" fill="white" stroke="#a1a1aa"/>
  <text x="107" y="474" class="label" text-anchor="middle">billing.md</text>
  <text x="313" y="474" class="label" text-anchor="middle">database.md</text>
  <text x="210" y="540" class="note" text-anchor="middle">A path to the relevant files.</text>
</svg>
