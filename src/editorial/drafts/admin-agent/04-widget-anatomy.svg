<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160">
<rect width="1600" height="1160" fill="#ffffff"/>
<style>
text{font-family:Helvetica, Arial, sans-serif;fill:#111111}.muted{fill:#767676}.line{stroke:#767676;stroke-width:2;fill:none}.num{fill:#4a7dfc}.rule{stroke:#d4d4d4;stroke-width:2}.mono{font-family:Menlo, Courier, monospace}
</style>
<text x="90" y="70" font-size="22" class="muted">Simplified illustration, fictional members</text>
<rect x="90" y="105" width="820" height="900" rx="28" fill="#e9e9e9"/>
<rect x="420" y="165" width="420" height="80" rx="24" fill="#ffffff"/>
<text x="450" y="215" font-size="25">Which members are past due?</text>
<rect x="150" y="295" width="440" height="56" rx="28" fill="#ffffff" stroke="#d4d4d4" stroke-width="2"/>
<circle cx="182" cy="323" r="9" fill="#4a7dfc"/>
<text x="205" y="331" font-size="22" class="mono">run_action members.list</text>
<rect x="150" y="395" width="700" height="390" rx="16" fill="#ffffff"/>
<rect x="150" y="395" width="700" height="76" rx="16" fill="#d4d4d4"/>
<text x="185" y="443" font-size="24" font-weight="700">Name</text>
<text x="400" y="443" font-size="24" font-weight="700">Last name</text>
<text x="615" y="443" font-size="24" font-weight="700">Status</text>
<line x1="150" y1="471" x2="850" y2="471" class="rule"/>
<line x1="150" y1="571" x2="850" y2="571" class="rule"/>
<line x1="150" y1="671" x2="850" y2="671" class="rule"/>
<text x="185" y="535" font-size="24">Ana</text><text x="400" y="535" font-size="24">Ruiz</text><text x="615" y="535" font-size="24">past_due</text>
<text x="185" y="635" font-size="24">Marc</text><text x="400" y="635" font-size="24">Puig</text><text x="615" y="635" font-size="24">past_due</text>
<text x="185" y="735" font-size="24">Leo</text><text x="400" y="735" font-size="24">Serra</text><text x="615" y="735" font-size="24">past_due</text>
<text x="155" y="860" font-size="26">These 3 members are past due.</text>
<g>
<circle cx="990" cy="205" r="24" class="num"/><text x="990" y="214" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">1</text>
<path d="M960 205 L850 205" class="line"/>
<text x="1030" y="185" font-size="23"><tspan x="1030" dy="0">The dashboard tells the agent</tspan><tspan x="1030" dy="32">which widgets it can show.</tspan></text>
<circle cx="990" cy="323" r="24" class="num"/><text x="990" y="332" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">2</text>
<path d="M960 323 L600 323" class="line"/>
<text x="1030" y="331" font-size="23"><tspan x="1030" dy="0">The model reads the data first.</tspan></text>
<circle cx="990" cy="560" r="24" class="num"/><text x="990" y="569" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">3</text>
<path d="M960 560 L850 560" class="line"/>
<text x="1030" y="540" font-size="23"><tspan x="1030" dy="0">The model picks the widget</tspan><tspan x="1030" dy="32">that fits the result.</tspan></text>
<circle cx="990" cy="852" r="24" class="num"/><text x="990" y="861" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">4</text>
<path d="M960 852 L850 852" class="line"/>
<text x="1030" y="860" font-size="23"><tspan x="1030" dy="0">One short sentence follows.</tspan></text>
</g>
<text x="80" y="1120" class="muted" font-size="22">Source: MAAT Admin Agent, Oct 2026.</text>
</svg>
