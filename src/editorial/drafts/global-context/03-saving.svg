<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="788" viewBox="0 0 1400 788">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="6" result="b"/>
      <feFlood flood-color="#5A4A30" flood-opacity="0.10"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="aha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C9973F"/>
    </marker>
    <symbol id="doc" viewBox="0 0 16 20">
      <path d="M2 1 H10 L15 6 V18 a1 1 0 0 1 -1 1 H2 a1 1 0 0 1 -1 -1 V2 a1 1 0 0 1 1 -1 z M10 1 V6 H15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M4 10 H12 M4 13.5 H12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </symbol>
  </defs>
  <style>
    .t { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>

  <rect width="1400" height="788" fill="#FAF7F0"/>

  <g transform="translate(0,-72)">

  <!-- Session -->
  <rect x="100" y="172" width="500" height="600" rx="18" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="136" y="224" class="t" font-size="26" font-weight="600" fill="#2B2620">Session</text>
  <text x="136" y="254" class="t" font-size="18" fill="#6F675C">A conversation between a person and the AI.</text>

  <text x="564" y="308" class="t" font-size="15" fill="#6F675C" text-anchor="end">Person</text>
  <rect x="296" y="318" width="268" height="52" rx="20" fill="#F1ECE2"/>
  <text x="320" y="350" class="t" font-size="18" fill="#2B2620">How much is the Team plan?</text>

  <text x="136" y="402" class="t" font-size="15" fill="#6F675C">AI</text>
  <rect x="136" y="412" width="324" height="52" rx="20" fill="#FFFFFF" stroke="#E6DED0" stroke-width="1.5"/>
  <text x="160" y="444" class="t" font-size="18" fill="#2B2620">The Team plan costs $99 a month.</text>

  <text x="564" y="496" class="t" font-size="15" fill="#6F675C" text-anchor="end">Person</text>
  <rect x="268" y="506" width="296" height="80" rx="20" fill="#F6EAD2" stroke="#C9973F" stroke-width="1.5"/>
  <text x="292" y="540" class="t" font-size="18" fill="#2B2620">We are raising the Team plan</text>
  <text x="292" y="566" class="t" font-size="18" fill="#2B2620">to $119 next month.</text>

  <text x="136" y="618" class="t" font-size="15" fill="#6F675C">AI</text>
  <rect x="136" y="628" width="292" height="52" rx="20" fill="#FFFFFF" stroke="#E6DED0" stroke-width="1.5"/>
  <text x="160" y="660" class="t" font-size="18" fill="#2B2620">Got it. I saved the new price.</text>

  <!-- Global context -->
  <rect x="840" y="172" width="460" height="600" rx="18" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="876" y="224" class="t" font-size="26" font-weight="600" fill="#2B2620">Global context</text>
  <text x="876" y="254" class="t" font-size="18" fill="#6F675C">Information the AI does not know by itself.</text>
  <text x="876" y="278" class="t" font-size="18" fill="#6F675C">It stays saved between conversations.</text>

  <g class="t" font-size="18" fill="#2B2620">
    <rect x="876" y="310" width="388" height="42" rx="12" fill="#FAF7F0"/>
    <use xlink:href="#doc" x="896" y="321" width="16" height="20" color="#A79D8F"/>
    <text x="926" y="337">Customers</text>
    <rect x="876" y="362" width="388" height="42" rx="12" fill="#FAF7F0"/>
    <use xlink:href="#doc" x="896" y="373" width="16" height="20" color="#A79D8F"/>
    <text x="926" y="389">Team</text>

    <rect x="876" y="414" width="388" height="92" rx="12" fill="#F6EAD2" stroke="#C9973F" stroke-width="1.5"/>
    <use xlink:href="#doc" x="896" y="425" width="16" height="20" color="#A9782A"/>
    <text x="926" y="441" font-weight="600" fill="#A9782A">Prices</text>
    <rect x="1170" y="424" width="78" height="26" rx="13" fill="#C9973F"/>
    <text x="1209" y="442" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Updated</text>
    <text x="926" y="484" font-size="17">Team plan:</text>
    <text x="1018" y="484" font-size="17" fill="#A79D8F">$99</text>
    <line x1="1016" y1="478" x2="1050" y2="478" stroke="#A79D8F" stroke-width="1.5"/>
    <text x="1060" y="484" font-size="17" fill="#A79D8F">→</text>
    <text x="1084" y="484" font-size="17" font-weight="600">$119</text>

    <rect x="876" y="516" width="388" height="42" rx="12" fill="#FAF7F0"/>
    <use xlink:href="#doc" x="896" y="527" width="16" height="20" color="#A79D8F"/>
    <text x="926" y="543">Roadmap</text>
    <rect x="876" y="568" width="388" height="42" rx="12" fill="#FAF7F0"/>
    <use xlink:href="#doc" x="896" y="579" width="16" height="20" color="#A79D8F"/>
    <text x="926" y="595">Decisions</text>
    <rect x="876" y="620" width="388" height="42" rx="12" fill="#FAF7F0"/>
    <use xlink:href="#doc" x="896" y="631" width="16" height="20" color="#A79D8F"/>
    <text x="926" y="647">Product</text>
  </g>

  <!-- Save -->
  <path d="M 572 546 C 700 546, 740 460, 866 460" fill="none" stroke="#C9973F" stroke-width="3" stroke-linecap="round" marker-end="url(#aha)"/>
  <g class="t" font-size="17" font-weight="600" fill="#A9782A" text-anchor="middle">
    <text x="720" y="572">The AI saves</text>
    <text x="720" y="594">what changed</text>
  </g>
  </g>
</svg>
