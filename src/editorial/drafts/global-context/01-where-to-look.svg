<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="744" viewBox="0 0 1400 744">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="6" result="b"/>
      <feFlood flood-color="#5A4A30" flood-opacity="0.10"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="aha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C9973F"/>
    </marker>
    <marker id="ahm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#B9AFA0"/>
    </marker>
  </defs>
  <style>
    .t { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>

  <rect width="1400" height="744" fill="#FAF7F0"/>

  <g transform="translate(0,-56)">
  <text x="80" y="160" class="t" font-size="26" font-weight="600" fill="#2B2620">Why a global context?</text>
  <text x="80" y="192" class="t" font-size="18" fill="#6F675C">It tells the AI where the information is, before it searches.</text>

  <!-- Without global context -->
  <rect x="80" y="236" width="540" height="480" rx="18" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="112" y="288" class="t" font-size="22" font-weight="600" fill="#2B2620">Without global context <tspan font-size="17" font-weight="400" fill="#6F675C">  The AI searches everywhere.</tspan></text>

  <rect x="310" y="330" width="80" height="44" rx="22" fill="#2B2620"/>
  <text x="350" y="358" class="t" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">AI</text>

  <g stroke="#B9AFA0" stroke-width="1.5" stroke-dasharray="5 6" fill="none" marker-end="url(#ahm)">
    <path d="M 350 374 L 156 612"/>
    <path d="M 350 374 L 250 612"/>
    <path d="M 350 374 L 350 612"/>
    <path d="M 350 374 L 450 612"/>
    <path d="M 350 374 L 544 612"/>
  </g>

  <g class="t" font-size="15" fill="#2B2620" text-anchor="middle">
    <rect x="112" y="620" width="88" height="44" rx="12" fill="#F1ECE2"/><text x="156" y="647">Stripe</text>
    <rect x="206" y="620" width="88" height="44" rx="12" fill="#F1ECE2"/><text x="250" y="647">Attio</text>
    <rect x="306" y="620" width="88" height="44" rx="12" fill="#F1ECE2"/><text x="350" y="647">Database</text>
    <rect x="406" y="620" width="88" height="44" rx="12" fill="#F1ECE2"/><text x="450" y="647">Drive</text>
    <rect x="500" y="620" width="88" height="44" rx="12" fill="#F1ECE2"/><text x="544" y="647">Slack</text>
  </g>

  <!-- With global context -->
  <rect x="780" y="236" width="540" height="480" rx="18" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="812" y="288" class="t" font-size="22" font-weight="600" fill="#2B2620">With global context <tspan font-size="17" font-weight="600" fill="#A9782A">  The AI knows where to look.</tspan></text>

  <rect x="1010" y="318" width="80" height="44" rx="22" fill="#2B2620"/>
  <text x="1050" y="346" class="t" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">AI</text>
  <line x1="1050" y1="362" x2="1050" y2="392" stroke="#C9973F" stroke-width="3" marker-end="url(#aha)"/>

  <rect x="850" y="398" width="400" height="168" rx="14" fill="#FAF7F0" stroke="#E6DED0"/>
  <text x="874" y="428" class="t" font-size="16" font-weight="600" fill="#2B2620">Global context</text>
  <rect x="866" y="442" width="368" height="40" rx="10" fill="#F6EAD2" stroke="#C9973F" stroke-width="1.5"/>
  <text x="884" y="468" class="t" font-size="16" font-weight="600" fill="#A9782A">Sales <tspan font-weight="400" fill="#2B2620">  Prices are in Stripe</tspan></text>
  <g opacity="0.5" class="t" font-size="16" fill="#2B2620">
    <rect x="866" y="490" width="368" height="30" rx="10" fill="#F1ECE2"/>
    <text x="884" y="510">People</text>
    <rect x="866" y="526" width="368" height="30" rx="10" fill="#F1ECE2"/>
    <text x="884" y="546">Product</text>
  </g>

  <path d="M 1050 566 V 612" stroke="#C9973F" stroke-width="3" fill="none" marker-end="url(#aha)"/>

  <g class="t" font-size="15" text-anchor="middle">
    <g opacity="0.45" fill="#2B2620">
      <rect x="812" y="620" width="88" height="44" rx="12" fill="#F1ECE2"/><text x="856" y="647">Attio</text>
      <rect x="906" y="620" width="88" height="44" rx="12" fill="#F1ECE2"/><text x="950" y="647">Database</text>
      <rect x="1106" y="620" width="88" height="44" rx="12" fill="#F1ECE2"/><text x="1150" y="647">Drive</text>
      <rect x="1200" y="620" width="88" height="44" rx="12" fill="#F1ECE2"/><text x="1244" y="647">Slack</text>
    </g>
    <rect x="1006" y="620" width="88" height="44" rx="12" fill="#F6EAD2" stroke="#C9973F" stroke-width="1.5"/>
    <text x="1050" y="647" font-weight="600" fill="#A9782A">Stripe</text>
  </g>
  </g>
</svg>
