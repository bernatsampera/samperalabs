<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="688" viewBox="0 0 1400 688">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="6" result="b"/>
      <feFlood flood-color="#5A4A30" flood-opacity="0.10"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="aha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C9973F"/>
    </marker>
    <marker id="ahm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#A79D8F"/>
    </marker>
    <symbol id="doc" viewBox="0 0 16 20">
      <path d="M2 1 H10 L15 6 V18 a1 1 0 0 1 -1 1 H2 a1 1 0 0 1 -1 -1 V2 a1 1 0 0 1 1 -1 z M10 1 V6 H15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M4 10 H12 M4 13.5 H12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </symbol>
  </defs>
  <style>
    .t { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>

  <rect width="1400" height="688" fill="#FAF7F0"/>

  <g transform="translate(0,-72)">

  <!-- Session -->
  <rect x="100" y="172" width="500" height="490" rx="18" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="136" y="224" class="t" font-size="26" font-weight="600" fill="#2B2620">Session</text>
  <text x="136" y="254" class="t" font-size="18" fill="#6F675C">A conversation between a person and the AI.</text>

  <text x="564" y="320" class="t" font-size="15" fill="#6F675C" text-anchor="end">Person</text>
  <rect x="296" y="330" width="268" height="52" rx="20" fill="#F1ECE2"/>
  <text x="320" y="362" class="t" font-size="18" fill="#2B2620">How much is the Team plan?</text>

  <text x="136" y="422" class="t" font-size="15" fill="#6F675C">AI</text>
  <rect x="136" y="432" width="360" height="96" rx="20" fill="#F6EAD2" stroke="#C9973F" stroke-width="1.5"/>
  <text x="160" y="468" class="t" font-size="18" fill="#2B2620">The Team plan costs $99 a month.</text>
  <use xlink:href="#doc" x="160" y="486" width="13" height="17" color="#A9782A"/>
  <text x="182" y="500" class="t" font-size="15" font-weight="600" fill="#A9782A">Used: Prices</text>

  <!-- Global context -->
  <rect x="840" y="172" width="460" height="490" rx="18" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="876" y="224" class="t" font-size="26" font-weight="600" fill="#2B2620">Global context</text>
  <text x="876" y="254" class="t" font-size="18" fill="#6F675C">Information the AI does not know by itself.</text>
  <text x="876" y="278" class="t" font-size="18" fill="#6F675C">It stays saved between conversations.</text>

  <g class="t" font-size="18" fill="#2B2620">
    <rect x="876" y="310" width="388" height="42" rx="12" fill="#FAF7F0"/>
    <use xlink:href="#doc" x="896" y="321" width="16" height="20" color="#A79D8F"/>
    <text x="926" y="337">Customers</text>
    <rect x="876" y="362" width="388" height="42" rx="12" fill="#FAF7F0"/>
    <use xlink:href="#doc" x="896" y="373" width="16" height="20" color="#A79D8F"/>
    <text x="926" y="389">Team</text>
    <rect x="876" y="414" width="388" height="42" rx="12" fill="#F6EAD2" stroke="#C9973F" stroke-width="1.5"/>
    <use xlink:href="#doc" x="896" y="425" width="16" height="20" color="#A9782A"/>
    <text x="926" y="441" font-weight="600" fill="#A9782A">Prices</text>
    <rect x="876" y="466" width="388" height="42" rx="12" fill="#FAF7F0"/>
    <use xlink:href="#doc" x="896" y="477" width="16" height="20" color="#A79D8F"/>
    <text x="926" y="493">Roadmap</text>
    <rect x="876" y="518" width="388" height="42" rx="12" fill="#FAF7F0"/>
    <use xlink:href="#doc" x="896" y="529" width="16" height="20" color="#A79D8F"/>
    <text x="926" y="545">Decisions</text>
    <rect x="876" y="570" width="388" height="42" rx="12" fill="#FAF7F0"/>
    <use xlink:href="#doc" x="896" y="581" width="16" height="20" color="#A79D8F"/>
    <text x="926" y="597">Product</text>
  </g>

  <!-- Load -->
  <path d="M 870 435 C 740 435, 640 480, 508 480" fill="none" stroke="#C9973F" stroke-width="3" stroke-linecap="round" marker-end="url(#aha)"/>
  <g class="t" font-size="17" font-weight="600" fill="#A9782A" text-anchor="middle">
    <text x="720" y="350">The AI loads only</text>
    <text x="720" y="372">what this question</text>
    <text x="720" y="394">needs</text>
  </g>
  </g>

</svg>
