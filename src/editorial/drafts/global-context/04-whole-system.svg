<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="824" viewBox="0 0 1400 824">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="6" result="b"/>
      <feFlood flood-color="#5A4A30" flood-opacity="0.10"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="aha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C9973F"/>
    </marker>
    <marker id="ahm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#A79D8F"/>
    </marker>
    <symbol id="doc" viewBox="0 0 16 20">
      <path d="M2 1 H10 L15 6 V18 a1 1 0 0 1 -1 1 H2 a1 1 0 0 1 -1 -1 V2 a1 1 0 0 1 1 -1 z M10 1 V6 H15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M4 10 H12 M4 13.5 H12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </symbol>
    <symbol id="folder" viewBox="0 0 20 16">
      <path d="M1 3 a1.5 1.5 0 0 1 1.5 -1.5 H7 L9 4 H17.5 a1.5 1.5 0 0 1 1.5 1.5 V13.5 a1.5 1.5 0 0 1 -1.5 1.5 H2.5 A1.5 1.5 0 0 1 1 13.5 z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
    </symbol>
  </defs>
  <style>
    .t { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>

  <rect width="1400" height="824" fill="#FAF7F0"/>

  <g transform="translate(0,-56)">
  <text x="80" y="160" class="t" font-size="26" font-weight="600" fill="#2B2620">The whole system</text>

  <!-- Session -->
  <rect x="80" y="200" width="480" height="490" rx="18" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="108" y="250" class="t" font-size="24" font-weight="600" fill="#2B2620">Session</text>
  <text x="108" y="278" class="t" font-size="17" fill="#6F675C">A conversation with the AI.</text>

  <rect x="108" y="304" width="424" height="252" rx="14" fill="#FAF7F0"/>
  <text x="128" y="338" class="t" font-size="18" font-weight="600" fill="#2B2620">Session context</text>
  <text x="128" y="362" class="t" font-size="15" fill="#6F675C">Small and exact.</text>
  <text x="128" y="396" class="t" font-size="16" fill="#2B2620">·  Map of the global context</text>
  <text x="128" y="424" class="t" font-size="16" fill="#2B2620">·  Rules to find things</text>
  <rect x="128" y="448" width="384" height="92" rx="12" fill="#F6EAD2" stroke="#C9973F" stroke-width="1.5"/>
  <text x="150" y="484" class="t" font-size="18" font-weight="600" fill="#A9782A">Relevant context</text>
  <text x="150" y="512" class="t" font-size="15" fill="#2B2620">Only what this question needs</text>

  <rect x="108" y="572" width="424" height="92" rx="14" fill="#FAF7F0"/>
  <text x="128" y="610" class="t" font-size="18" font-weight="600" fill="#2B2620">AI model</text>
  <text x="128" y="636" class="t" font-size="15" fill="#6F675C">Answers the person.</text>

  <!-- Adapter -->
  <rect x="640" y="200" width="200" height="490" rx="18" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="664" y="250" class="t" font-size="24" font-weight="600" fill="#2B2620">Adapter</text>
  <text x="664" y="278" class="t" font-size="17" fill="#6F675C">The AI's tool to</text>
  <text x="664" y="300" class="t" font-size="17" fill="#6F675C">read and save.</text>
  <text x="664" y="336" class="t" font-size="15" fill="#6F675C">An MCP server, a file,</text>
  <text x="664" y="356" class="t" font-size="15" fill="#6F675C">anything.</text>
  <g class="t" font-size="14" fill="#2B2620">
    <rect x="664" y="380" width="152" height="30" rx="15" fill="#F1ECE2"/><text x="680" y="400">List a folder</text>
    <rect x="664" y="418" width="152" height="30" rx="15" fill="#F1ECE2"/><text x="680" y="438">Read information</text>
    <rect x="664" y="456" width="152" height="30" rx="15" fill="#F1ECE2"/><text x="680" y="476">Save information</text>
  </g>

  <!-- Global context -->
  <rect x="920" y="200" width="400" height="490" rx="18" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="948" y="250" class="t" font-size="24" font-weight="600" fill="#2B2620">Global context</text>
  <text x="948" y="278" class="t" font-size="17" fill="#6F675C">Information the AI does not</text>
  <text x="948" y="300" class="t" font-size="17" fill="#6F675C">know by itself.</text>

  <g class="t" font-size="16" fill="#2B2620">
    <use xlink:href="#folder" x="958" y="334" width="18" height="15" color="#A79D8F"/><text x="986" y="346">People</text>
    <use xlink:href="#doc" x="990" y="363" width="13" height="16" color="#A79D8F"/><text x="1012" y="376">Team</text>
    <use xlink:href="#folder" x="958" y="398" width="18" height="15" color="#A79D8F"/><text x="986" y="410">Product</text>
    <use xlink:href="#doc" x="990" y="427" width="13" height="16" color="#A79D8F"/><text x="1012" y="440">Roadmap</text>
    <use xlink:href="#folder" x="958" y="462" width="18" height="15" color="#A9782A"/><text x="986" y="474" font-weight="600" fill="#A9782A">Sales</text>
    <rect x="980" y="482" width="200" height="32" rx="10" fill="#F6EAD2" stroke="#C9973F" stroke-width="1.5"/>
    <use xlink:href="#doc" x="990" y="490" width="13" height="16" color="#A9782A"/><text x="1012" y="503" font-weight="600" fill="#A9782A">Prices</text>
    <use xlink:href="#doc" x="990" y="527" width="13" height="16" color="#A79D8F"/><text x="1012" y="540">Discounts</text>
    <use xlink:href="#folder" x="958" y="560" width="18" height="15" color="#A79D8F"/><text x="986" y="572">Decisions</text>
    <use xlink:href="#doc" x="990" y="595" width="13" height="16" color="#A79D8F"/><text x="1012" y="608">Price change</text>
    <rect x="1118" y="592" width="44" height="22" rx="11" fill="#F1ECE2"/><text x="1140" y="608" font-size="13" fill="#6F675C" text-anchor="middle">new</text>
  </g>

  <!-- Load: global context -> adapter -> relevant context -->
  <line x1="976" y1="498" x2="514" y2="498" stroke="#C9973F" stroke-width="3" stroke-linecap="round" marker-end="url(#aha)"/>
  <rect x="566" y="482" width="68" height="32" rx="16" fill="#FAF7F0" stroke="#C9973F" stroke-width="1.5"/>
  <text x="600" y="503" class="t" font-size="15" font-weight="600" fill="#A9782A" text-anchor="middle">load</text>

  <!-- Save: AI model -> adapter -> global context -->
  <line x1="534" y1="612" x2="976" y2="612" stroke="#A79D8F" stroke-width="2" stroke-linecap="round" marker-end="url(#ahm)"/>
  <rect x="566" y="596" width="68" height="32" rx="16" fill="#FAF7F0" stroke="#D9D0C1" stroke-width="1.5"/>
  <text x="600" y="617" class="t" font-size="15" fill="#6F675C" text-anchor="middle">save</text>

  <!-- Rule -->
  <rect x="80" y="730" width="1240" height="80" rx="18" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="700" y="778" class="t" font-size="20" font-weight="600" fill="#2B2620" text-anchor="middle">Write the global context for how the AI loads it. <tspan font-weight="400" fill="#6F675C">Minimal to load, fast to find.</tspan></text>
  </g>
</svg>
